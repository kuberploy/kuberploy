name: Feature proposal
description: Propose a focused capability or workflow change
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem without prescribing the implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: checkboxes
    id: boundaries
    attributes:
      label: Relevant boundaries
      options:
        - label: Public API or schema
        - label: GitOps repository contract
        - label: Authentication or tenant isolation
        - label: Build or secret trust boundary
        - label: Installation, upgrade, or rollback
