name: Bug report
description: Report a reproducible Kuberploy defect
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Never include credentials or application secrets. Report vulnerabilities privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Kuberploy version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes distribution and version
      placeholder: OrbStack v1.35.6+orb1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and a minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or operation details
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, tokens, private URLs, and application secrets.
          required: true
        - label: This is not a vulnerability report.
          required: true
