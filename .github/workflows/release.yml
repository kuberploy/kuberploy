name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      repair_release_tag:
        description: "Existing immutable release tag whose readable image tags must be repaired"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: release/tools/go.sum
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - name: Validate source and manifest dry run
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          python3 release/check_public_source.py --root .
          kp_args=(--root .)
          if [[ "${RELEASE_EVENT}" == "push" ]]; then
            kp_args+=(--tag "${GITHUB_REF_NAME}")
          fi
          python3 release/validate_source.py "${kp_args[@]}"
          ./release/test-manifest.sh

  chart-lifecycle:
    name: Chart install, upgrade, and rollback render
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - name: Render lifecycle
        run: ./release/test-chart-lifecycle.sh

  release-gate:
    name: Verify trusted release tag
    needs: [release-contract, chart-lifecycle]
    if: needs.release-contract.result == 'success' && needs.chart-lifecycle.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'kuberploy/kuberploy' && github.ref_protected == true
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      created_at: ${{ steps.release.outputs.created_at }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      summary: ${{ steps.release.outputs.summary }}
      breaking_changes: ${{ steps.release.outputs.breaking_changes }}
      supported_upgrade_from: ${{ steps.release.outputs.supported_upgrade_from }}
      kubernetes_constraint: ${{ steps.release.outputs.kubernetes_constraint }}
      stable_candidate_tag: ${{ steps.release.outputs.stable_candidate_tag }}
      stable_candidate_commit: ${{ steps.release.outputs.stable_candidate_commit }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release metadata
        id: release
        run: |
          kp_version="$(python3 release/validate_source.py --root . --tag "${GITHUB_REF_NAME}")"
          kp_tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          [[ "${kp_tag_commit}" == "${GITHUB_SHA}" ]]
          kp_source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          kp_created_at="$(date --utc --date="@${kp_source_date_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          kp_summary="$(python3 -c 'import json; print(json.load(open("release/metadata.json", encoding="utf-8"))["summary"])')"
          kp_breaking="$(python3 -c 'import json; print(str(json.load(open("release/metadata.json", encoding="utf-8"))["breakingChanges"]).lower())')"
          kp_upgrade_range="$(python3 -c 'import json; print(json.load(open("release/metadata.json", encoding="utf-8"))["supportedUpgradeFrom"])')"
          kp_kube_constraint="$(PYTHONPATH=release python3 -c 'from pathlib import Path; from validate_semantics import yaml_scalar; print(yaml_scalar(Path("charts/kuberploy/Chart.yaml").read_text(), ("kubeVersion",)))')"
          kp_stable_candidate_tag=""
          kp_stable_candidate_commit=""
          if [[ "${kp_version}" != *-* ]]; then
            kp_receipt="release/qualifications/${kp_version}.json"
            kp_stable_candidate_tag="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidateTag"])' "${kp_receipt}")"
            kp_stable_candidate_commit="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidateCommit"])' "${kp_receipt}")"
          fi
          {
            echo "version=${kp_version}"
            echo "created_at=${kp_created_at}"
            echo "source_date_epoch=${kp_source_date_epoch}"
            echo "summary=${kp_summary}"
            echo "breaking_changes=${kp_breaking}"
            echo "supported_upgrade_from=${kp_upgrade_range}"
            echo "kubernetes_constraint=${kp_kube_constraint}"
            echo "stable_candidate_tag=${kp_stable_candidate_tag}"
            echo "stable_candidate_commit=${kp_stable_candidate_commit}"
          } >>"${GITHUB_OUTPUT}"
      - name: Verify qualified immutable release candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          CANDIDATE_TAG: ${{ steps.release.outputs.stable_candidate_tag }}
          CANDIDATE_COMMIT: ${{ steps.release.outputs.stable_candidate_commit }}
        run: |
          if [[ "${VERSION}" == *-* ]]; then
            [[ -z "${CANDIDATE_TAG}" && -z "${CANDIDATE_COMMIT}" ]]
            exit 0
          fi
          [[ "${CANDIDATE_TAG}" == "v${VERSION}-rc."* ]]
          [[ "${CANDIDATE_TAG#v${VERSION}-rc.}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CANDIDATE_COMMIT}" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-list -n 1 "${CANDIDATE_TAG}")" == "${CANDIDATE_COMMIT}" ]]
          kp_candidate_state="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${CANDIDATE_TAG}" \
            --jq '[.tag_name, (.draft | tostring), (.prerelease | tostring), (.immutable | tostring)] | join(",")')"
          [[ "${kp_candidate_state}" == "${CANDIDATE_TAG},false,true,true" ]]
      - name: Reject an existing GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if kp_release_lookup="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1)"; then
            echo "A GitHub release already exists for ${GITHUB_REF_NAME}; refusing to push artifacts." >&2
            exit 1
          elif [[ "${kp_release_lookup}" != *"HTTP 404"* ]]; then
            echo "Could not prove that ${GITHUB_REF_NAME} is unused: ${kp_release_lookup}" >&2
            exit 1
          fi

  build-images:
    name: Build ${{ matrix.component }} (${{ matrix.platform }})
    needs: release-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - component: api
            runner: ubuntu-26.04
            platform: linux/amd64
            architecture: amd64
            context: .
            dockerfile: build/package/api.Dockerfile
          - component: api
            runner: ubuntu-26.04-arm
            platform: linux/arm64
            architecture: arm64
            context: .
            dockerfile: build/package/api.Dockerfile
          - component: worker
            runner: ubuntu-26.04
            platform: linux/amd64
            architecture: amd64
            context: .
            dockerfile: build/package/worker.Dockerfile
          - component: worker
            runner: ubuntu-26.04-arm
            platform: linux/arm64
            architecture: arm64
            context: .
            dockerfile: build/package/worker.Dockerfile
          - component: web
            runner: ubuntu-26.04
            platform: linux/amd64
            architecture: amd64
            context: web
            dockerfile: web/Dockerfile
          - component: web
            runner: ubuntu-26.04-arm
            platform: linux/arm64
            architecture: arm64
            context: web
            dockerfile: web/Dockerfile
          - component: migration
            runner: ubuntu-26.04
            platform: linux/amd64
            architecture: amd64
            context: .
            dockerfile: build/package/migration.Dockerfile
          - component: migration
            runner: ubuntu-26.04-arm
            platform: linux/arm64
            architecture: arm64
            context: .
            dockerfile: build/package/migration.Dockerfile
          - component: upgrader
            runner: ubuntu-26.04
            platform: linux/amd64
            architecture: amd64
            context: .
            dockerfile: build/package/upgrader.Dockerfile
          - component: upgrader
            runner: ubuntu-26.04-arm
            platform: linux/arm64
            architecture: arm64
            context: .
            dockerfile: build/package/upgrader.Dockerfile
          - component: builder-agent
            runner: ubuntu-26.04
            platform: linux/amd64
            architecture: amd64
            context: .
            dockerfile: build/package/builder-agent.Dockerfile
          - component: builder-agent
            runner: ubuntu-26.04-arm
            platform: linux/arm64
            architecture: arm64
            context: .
            dockerfile: build/package/builder-agent.Dockerfile
    env:
      REGISTRY_IMAGE: ghcr.io/kuberploy/kuberploy-${{ matrix.component }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify native runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          case "${EXPECTED_ARCHITECTURE}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Runner architecture does not match ${EXPECTED_ARCHITECTURE}: $(uname -m)" >&2; exit 1 ;;
          esac
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.release-gate.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ needs.release-gate.outputs.created_at }}
            SOURCE_DATE_EPOCH=${{ needs.release-gate.outputs.source_date_epoch }}
          labels: |
            org.opencontainers.image.title=Kuberploy ${{ matrix.component }}
            org.opencontainers.image.source=https://github.com/kuberploy/kuberploy
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ needs.release-gate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.release-gate.outputs.created_at }}
      - name: Verify and record platform digest
        env:
          COMPONENT: ${{ matrix.component }}
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          kp_image_json=""
          for kp_attempt in {1..12}; do
            if kp_image_json="$(docker buildx imagetools inspect \
              "${REGISTRY_IMAGE}@${IMAGE_DIGEST}" --format '{{json .Image}}' 2>&1)"; then
              break
            fi
            if (( kp_attempt == 12 )); then
              printf '%s\n' "${kp_image_json}" >&2
              exit 1
            fi
            sleep 5
          done
          jq -e --arg architecture "${ARCHITECTURE}" \
            '.os == "linux" and .architecture == $architecture' <<<"${kp_image_json}" >/dev/null
          mkdir -p "${RUNNER_TEMP}/image-digests"
          jq -n \
            --arg component "${COMPONENT}" \
            --arg platform "${PLATFORM}" \
            --arg architecture "${ARCHITECTURE}" \
            --arg image "${REGISTRY_IMAGE}" \
            --arg digest "${IMAGE_DIGEST}" \
            '{component: $component, platform: $platform, architecture: $architecture, image: $image, digest: $digest}' \
            >"${RUNNER_TEMP}/image-digests/${COMPONENT}-${ARCHITECTURE}.json"
      - name: Upload platform digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.component }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/image-digests/${{ matrix.component }}-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 1

  assemble-images:
    name: Assemble multi-platform image indexes
    needs: build-images
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.assemble.outputs.api_digest }}
      worker_digest: ${{ steps.assemble.outputs.worker_digest }}
      web_digest: ${{ steps.assemble.outputs.web_digest }}
      migration_digest: ${{ steps.assemble.outputs.migration_digest }}
      upgrader_digest: ${{ steps.assemble.outputs.upgrader_digest }}
      builder_agent_digest: ${{ steps.assemble.outputs.builder_agent_digest }}
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and verify image indexes
        id: assemble
        run: |
          mkdir -p "${RUNNER_TEMP}/image-indexes"
          for kp_component in api worker web migration upgrader builder-agent; do
            kp_image="ghcr.io/kuberploy/kuberploy-${kp_component}"
            kp_sources=()
            kp_amd64_digest=""
            kp_arm64_digest=""
            for kp_architecture in amd64 arm64; do
              kp_platform="linux/${kp_architecture}"
              kp_record="${RUNNER_TEMP}/image-digests/${kp_component}-${kp_architecture}.json"
              [[ -f "${kp_record}" ]] || {
                echo "Missing ${kp_component} ${kp_platform} digest record." >&2
                exit 1
              }
              kp_digest="$(jq -er \
                --arg component "${kp_component}" \
                --arg platform "${kp_platform}" \
                --arg architecture "${kp_architecture}" \
                --arg image "${kp_image}" \
                'select(.component == $component and .platform == $platform and .architecture == $architecture and .image == $image) | .digest' \
                "${kp_record}")"
              [[ "${kp_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
              kp_image_json=""
              for kp_attempt in {1..12}; do
                if kp_image_json="$(docker buildx imagetools inspect \
                  "${kp_image}@${kp_digest}" --format '{{json .Image}}' 2>&1)"; then
                  break
                fi
                if (( kp_attempt == 12 )); then
                  printf '%s\n' "${kp_image_json}" >&2
                  exit 1
                fi
                sleep 5
              done
              jq -e --arg architecture "${kp_architecture}" \
                '.os == "linux" and .architecture == $architecture' <<<"${kp_image_json}" >/dev/null
              kp_sources+=("${kp_image}@${kp_digest}")
              if [[ "${kp_architecture}" == "amd64" ]]; then
                kp_amd64_digest="${kp_digest}"
              else
                kp_arm64_digest="${kp_digest}"
              fi
            done

            kp_candidate="${kp_image}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            if kp_candidate_lookup="$(docker buildx imagetools inspect "${kp_candidate}" 2>&1)"; then
              echo "Candidate image index already exists; refusing to overwrite ${kp_candidate}." >&2
              exit 1
            elif [[ ! "${kp_candidate_lookup,,}" =~ (not[[:space:]]found|manifest[[:space:]_]unknown) ]]; then
              echo "Could not prove candidate image index is unused: ${kp_candidate_lookup}" >&2
              exit 1
            fi

            kp_metadata="${RUNNER_TEMP}/image-indexes/${kp_component}.json"
            docker buildx imagetools create \
              --tag "${kp_candidate}" \
              --metadata-file "${kp_metadata}" \
              "${kp_sources[@]}"
            kp_index_digest="$(jq -er '."containerimage.descriptor".digest' "${kp_metadata}")"
            [[ "${kp_index_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
            kp_index_json="$(docker buildx imagetools inspect \
              "${kp_image}@${kp_index_digest}" --format '{{json .Manifest}}')"
            jq -e \
              --arg amd64 "${kp_amd64_digest}" \
              --arg arm64 "${kp_arm64_digest}" \
              '.mediaType == "application/vnd.oci.image.index.v1+json" and
               (.manifests | length == 2) and
               any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64" and .digest == $amd64) and
               any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64" and .digest == $arm64)' \
              <<<"${kp_index_json}" >/dev/null
            kp_output_name="${kp_component//-/_}_digest"
            echo "${kp_output_name}=${kp_index_digest}" >>"${GITHUB_OUTPUT}"
          done

  publish:
    name: Publish immutable release
    needs: [release-gate, assemble-images]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: release/tools/go.sum
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and validate release artifacts
        env:
          TZ: UTC
          VERSION: ${{ needs.release-gate.outputs.version }}
          CREATED_AT: ${{ needs.release-gate.outputs.created_at }}
          SOURCE_DATE_EPOCH: ${{ needs.release-gate.outputs.source_date_epoch }}
          SUMMARY: ${{ needs.release-gate.outputs.summary }}
          BREAKING_CHANGES: ${{ needs.release-gate.outputs.breaking_changes }}
          SUPPORTED_UPGRADE_FROM: ${{ needs.release-gate.outputs.supported_upgrade_from }}
          KUBERNETES_CONSTRAINT: ${{ needs.release-gate.outputs.kubernetes_constraint }}
          API_DIGEST: ${{ needs.assemble-images.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.assemble-images.outputs.worker_digest }}
          WEB_DIGEST: ${{ needs.assemble-images.outputs.web_digest }}
          MIGRATION_DIGEST: ${{ needs.assemble-images.outputs.migration_digest }}
          UPGRADER_DIGEST: ${{ needs.assemble-images.outputs.upgrader_digest }}
          BUILDER_AGENT_DIGEST: ${{ needs.assemble-images.outputs.builder_agent_digest }}
        run: |
          mkdir release-dist
          for kp_digest in "${API_DIGEST}" "${WORKER_DIGEST}" "${WEB_DIGEST}" "${MIGRATION_DIGEST}" "${UPGRADER_DIGEST}" "${BUILDER_AGENT_DIGEST}"; do
            [[ "${kp_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          done
          kp_chart_args=(
            --source charts/kuberploy
            --builder-chart charts/kuberploy-builder
            --destination release-dist/chart
            --version "${VERSION}"
            --api-image "ghcr.io/kuberploy/kuberploy-api@${API_DIGEST}"
            --worker-image "ghcr.io/kuberploy/kuberploy-worker@${WORKER_DIGEST}"
            --web-image "ghcr.io/kuberploy/kuberploy-web@${WEB_DIGEST}"
            --migration-image "ghcr.io/kuberploy/kuberploy-migration@${MIGRATION_DIGEST}"
            --upgrader-image "ghcr.io/kuberploy/kuberploy-upgrader@${UPGRADER_DIGEST}"
            --builder-agent-image "ghcr.io/kuberploy/kuberploy-builder-agent@${BUILDER_AGENT_DIGEST}"
          )
          python3 release/package_chart.py "${kp_chart_args[@]}"
          helm lint release-dist/chart
          kp_chart_package="release-dist/kuberploy-${VERSION}.tgz"
          python3 release/package_chart_archive.py \
            --source release-dist/chart \
            --output "${kp_chart_package}" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}"
          kp_chart_digest="$(python3 release/chart_oci_digest.py \
            --chart release-dist/chart/Chart.yaml \
            --package "${kp_chart_package}" \
            --created-at "${CREATED_AT}")"
          [[ "${kp_chart_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          python3 release/package_component_charts.py \
            --root . \
            --destination release-dist/component-charts \
            --version "${VERSION}" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}" \
            --created-at "${CREATED_AT}" \
            --builder-agent-image "ghcr.io/kuberploy/kuberploy-builder-agent@${BUILDER_AGENT_DIGEST}"
          kp_component_chart_args=()
          kp_component_packages=()
          for kp_name in \
            kuberploy-argocd \
            kuberploy-installer \
            kuberploy-builder \
            kuberploy-cert-manager \
            kuberploy-edge \
            kuberploy-external-dns \
            kuberploy-external-secrets \
            kuberploy-monitoring \
            kuberploy-postgresql \
            kuberploy-registry \
            kuberploy-runtime \
            kuberploy-sealed-secrets \
            kuberploy-valkey; do
            kp_lint_args=()
            case "${kp_name}" in
              kuberploy-argocd)
                kp_namespace=argocd
                kp_lint_args+=(
                  --set argoFoundation.argoCD.managed=false
                  --set argoFoundation.argoCD.adoptExisting=true
                  --set argoFoundation.argoCD.capabilitiesConfirmed=true
                )
                ;;
              kuberploy-installer)
                kp_namespace=argocd
                kp_lint_args+=(--set bootstrap.argoCD.enabled=false --set bootstrap.argoCD.mode=disabled)
                ;;
              kuberploy-cert-manager) kp_namespace=cert-manager ;;
              kuberploy-edge) kp_namespace=kuberploy-edge ;;
              kuberploy-external-dns) kp_namespace=kuberploy-dns ;;
              kuberploy-external-secrets)
                kp_namespace=external-secrets
                kp_lint_args+=(--set secretFoundation.operator.capabilitiesConfirmed=true)
                ;;
              kuberploy-monitoring) kp_namespace=kuberploy-monitoring ;;
              kuberploy-postgresql) kp_namespace=kuberploy-postgresql ;;
              kuberploy-registry) kp_namespace=kuberploy-registry ;;
              kuberploy-sealed-secrets)
                kp_namespace=sealed-secrets
                kp_lint_args+=(--set secretFoundation.controller.capabilitiesConfirmed=true)
                ;;
              kuberploy-valkey) kp_namespace=kuberploy-valkey ;;
              *) kp_namespace=kuberploy-system ;;
            esac
            helm lint "release-dist/component-charts/${kp_name}" --namespace "${kp_namespace}" "${kp_lint_args[@]}"
            kp_component_package="release-dist/${kp_name}-${VERSION}.tgz"
            python3 release/package_chart_archive.py \
              --source "release-dist/component-charts/${kp_name}" \
              --output "${kp_component_package}" \
              --source-date-epoch "${SOURCE_DATE_EPOCH}"
            kp_component_digest="$(python3 release/chart_oci_digest.py \
              --chart "release-dist/component-charts/${kp_name}/Chart.yaml" \
              --package "${kp_component_package}" \
              --created-at "${CREATED_AT}")"
            [[ "${kp_component_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
            kp_component_chart_args+=(--component-chart "${kp_name}" "${kp_component_package}" "${kp_component_digest}")
            kp_component_packages+=("${kp_component_package}")
          done
          kp_manifest_args=(
            --root .
            --tag "${GITHUB_REF_NAME}"
            --repository "${GITHUB_REPOSITORY}"
            --commit "${GITHUB_SHA}"
            --created-at "${CREATED_AT}"
            --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            --summary "${SUMMARY}"
            --supported-upgrade-from "${SUPPORTED_UPGRADE_FROM}"
            --kubernetes-constraint "${KUBERNETES_CONSTRAINT}"
            --api-reference ghcr.io/kuberploy/kuberploy-api
            --api-digest "${API_DIGEST}"
            --worker-reference ghcr.io/kuberploy/kuberploy-worker
            --worker-digest "${WORKER_DIGEST}"
            --web-reference ghcr.io/kuberploy/kuberploy-web
            --web-digest "${WEB_DIGEST}"
            --migration-reference ghcr.io/kuberploy/kuberploy-migration
            --migration-digest "${MIGRATION_DIGEST}"
            --upgrader-reference ghcr.io/kuberploy/kuberploy-upgrader
            --upgrader-digest "${UPGRADER_DIGEST}"
            --builder-agent-reference ghcr.io/kuberploy/kuberploy-builder-agent
            --builder-agent-digest "${BUILDER_AGENT_DIGEST}"
            --chart-oci-reference "ghcr.io/kuberploy/charts/kuberploy:${VERSION}"
            --chart-oci-digest "${kp_chart_digest}"
            --chart-package "${kp_chart_package}"
            "${kp_component_chart_args[@]}"
            --output release-dist/release-manifest.json
          )
          if [[ "${BREAKING_CHANGES}" == "true" ]]; then
            kp_manifest_args+=(--breaking-changes)
          fi
          python3 release/generate_manifest.py "${kp_manifest_args[@]}"
          ./release/validate-manifest.sh release-dist/release-manifest.json release-dist "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          ./release/create-checksums.sh \
            release-dist/SHA256SUMS \
            release-dist/release-manifest.json \
            "${kp_chart_package}" \
            "${kp_component_packages[@]}"
          (
            cd release-dist
            sha256sum --check SHA256SUMS
          )
      - name: Publish or verify readable image tags
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          API_DIGEST: ${{ needs.assemble-images.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.assemble-images.outputs.worker_digest }}
          WEB_DIGEST: ${{ needs.assemble-images.outputs.web_digest }}
          MIGRATION_DIGEST: ${{ needs.assemble-images.outputs.migration_digest }}
          UPGRADER_DIGEST: ${{ needs.assemble-images.outputs.upgrader_digest }}
          BUILDER_AGENT_DIGEST: ${{ needs.assemble-images.outputs.builder_agent_digest }}
        run: |
          for kp_record in \
            "api:${API_DIGEST}" \
            "worker:${WORKER_DIGEST}" \
            "web:${WEB_DIGEST}" \
            "migration:${MIGRATION_DIGEST}" \
            "upgrader:${UPGRADER_DIGEST}" \
            "builder-agent:${BUILDER_AGENT_DIGEST}"; do
            kp_component="${kp_record%%:*}"
            kp_digest="${kp_record#*:}"
            kp_image="ghcr.io/kuberploy/kuberploy-${kp_component}"
            kp_tagged_image="${kp_image}:${VERSION}"
            if kp_tag_lookup="$(docker buildx imagetools inspect "${kp_tagged_image}" --format '{{json .Manifest}}' 2>&1)"; then
              kp_tag_digest="$(jq -er .digest <<<"${kp_tag_lookup}")"
              [[ "${kp_tag_digest}" == "${kp_digest}" ]] || {
                echo "Readable image tag already points to different content: ${kp_tagged_image}." >&2
                exit 1
              }
            elif [[ "${kp_tag_lookup,,}" =~ (not[[:space:]]found|manifest[[:space:]_]unknown) ]]; then
              docker buildx imagetools create --tag "${kp_tagged_image}" "${kp_image}@${kp_digest}"
            else
              echo "Could not determine whether readable image tag exists: ${kp_tagged_image}." >&2
              exit 1
            fi
            kp_published_digest="$(docker buildx imagetools inspect \
              "${kp_tagged_image}" --format '{{json .Manifest}}' | jq -er .digest)"
            [[ "${kp_published_digest}" == "${kp_digest}" ]]
          done
      - name: Publish or verify immutable chart set
        env:
          TZ: UTC
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          while IFS= read -r kp_record; do
            kp_name="$(jq -er .name <<<"${kp_record}")"
            kp_expected_reference="ghcr.io/kuberploy/charts/${kp_name}:${VERSION}"
            kp_oci_reference="$(jq -er .ociReference <<<"${kp_record}")"
            [[ "${kp_oci_reference}" == "${kp_expected_reference}" ]]
            kp_expected_digest="$(jq -er .ociDigest <<<"${kp_record}")"
            [[ "${kp_expected_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
            kp_package_name="$(jq -er .package <<<"${kp_record}")"
            [[ "${kp_package_name}" == "${kp_name}-${VERSION}.tgz" ]]
            kp_chart_package="release-dist/${kp_package_name}"
            [[ -f "${kp_chart_package}" ]]
            kp_chart_reference="oci://ghcr.io/kuberploy/charts/${kp_name}"
            if kp_chart_lookup="$(helm show chart "${kp_chart_reference}" --version "${VERSION}" 2>&1)"; then
              kp_remote_directory="release-dist/remote-${kp_name}"
              mkdir "${kp_remote_directory}"
              kp_pull_output="$(helm pull "${kp_chart_reference}" \
                --version "${VERSION}" --destination "${kp_remote_directory}" 2>&1)"
              printf '%s\n' "${kp_pull_output}"
              kp_published_digest="$(printf '%s\n' "${kp_pull_output}" | sed -n 's/^Digest: //p' | tail -n 1)"
              cmp --silent "${kp_chart_package}" "${kp_remote_directory}/${kp_package_name}" || {
                echo "OCI chart ${kp_name} ${VERSION} exists with different package bytes; refusing to overwrite it." >&2
                exit 1
              }
            elif [[ "${kp_chart_lookup,,}" =~ (not[[:space:]]found|manifest[[:space:]_]unknown) ]]; then
              kp_push_output="$(helm push "${kp_chart_package}" oci://ghcr.io/kuberploy/charts 2>&1)"
              printf '%s\n' "${kp_push_output}"
              kp_published_digest="$(printf '%s\n' "${kp_push_output}" | sed -n 's/^Digest: //p' | tail -n 1)"
            else
              echo "Could not determine whether OCI chart ${kp_name} ${VERSION} exists: ${kp_chart_lookup}" >&2
              exit 1
            fi
            [[ "${kp_published_digest}" == "${kp_expected_digest}" ]] || {
              echo "OCI chart ${kp_name} digest mismatch: expected ${kp_expected_digest}, got ${kp_published_digest}" >&2
              exit 1
            }
          done < <(jq -c \
            '(.artifacts.componentCharts[] | select(.name == "kuberploy-runtime")), .artifacts.chart, (.artifacts.componentCharts[] | select(.name != "kuberploy-runtime"))' \
            release-dist/release-manifest.json)
      - name: Create draft and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          kp_release_args=(
            "${GITHUB_REF_NAME}"
            --repo "${GITHUB_REPOSITORY}"
            --verify-tag
            --draft
            --title "Kuberploy ${VERSION}"
            --generate-notes
            release-dist/release-manifest.json
            release-dist/*.tgz
            release-dist/SHA256SUMS
          )
          kp_expected_prerelease="false"
          if [[ "${VERSION}" == *-* ]]; then
            kp_release_args+=(--prerelease)
            kp_expected_prerelease="true"
          fi
          gh release create "${kp_release_args[@]}"
          [[ "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" == "true" ]]
          kp_publish_args=("${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false)
          if [[ "${kp_expected_prerelease}" == "false" ]]; then
            kp_publish_args+=(--latest)
          fi
          gh release edit "${kp_publish_args[@]}"
          kp_release_state=""
          for kp_attempt in {1..12}; do
            kp_release_state="$(gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
              --jq '[.draft, .prerelease, (.immutable == true)] | join(",")')"
            [[ "${kp_release_state}" == "false,${kp_expected_prerelease},true" ]] && break
            sleep 5
          done
          [[ "${kp_release_state}" == "false,${kp_expected_prerelease},true" ]] || {
            echo "Published release did not become immutable: ${kp_release_state}" >&2
            exit 1
          }

  fresh-k3s-install:
    name: Fresh remote K3s installer qualification
    needs: [release-gate, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - name: Install and qualify the immutable release on fresh K3s
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -Eeuo pipefail
          kp_k3s_pid=""
          kp_port_forward_pid=""
          kp_cleanup() {
            kp_status=$?
            trap - EXIT
            set +e
            if [[ "${kp_status}" -ne 0 && -r "${kp_kubeconfig:-}" ]]; then
              kubectl --context default --namespace argocd logs \
                job/kuberploy-installer-application-health --all-containers=true 2>/dev/null || true
              kubectl --context default --namespace argocd get applications.argoproj.io \
                --selector app.kubernetes.io/instance=kuberploy-installer \
                --output custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status \
                2>/dev/null || true
              kubectl --context default get pods --all-namespaces \
                --selector app.kubernetes.io/part-of=kuberploy \
                --output custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,PHASE:.status.phase \
                2>/dev/null || true
            fi
            if [[ -n "${kp_port_forward_pid}" ]]; then
              kill "${kp_port_forward_pid}" 2>/dev/null
              wait "${kp_port_forward_pid}" 2>/dev/null
            fi
            if [[ -n "${kp_k3s_pid}" ]]; then
              sudo kill "${kp_k3s_pid}" 2>/dev/null
              for _ in {1..30}; do
                sudo kill -0 "${kp_k3s_pid}" 2>/dev/null || break
                sleep 1
              done
              sudo kill -KILL "${kp_k3s_pid}" 2>/dev/null
              wait "${kp_k3s_pid}" 2>/dev/null
            fi
            exit "${kp_status}"
          }
          trap kp_cleanup EXIT

          kp_k3s_tag='v1.36.3+k3s1'
          kp_k3s_url_tag="${kp_k3s_tag/+/%2B}"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/k3s" \
            "https://github.com/k3s-io/k3s/releases/download/${kp_k3s_url_tag}/k3s"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/sha256sum-amd64.txt" \
            "https://github.com/k3s-io/k3s/releases/download/${kp_k3s_url_tag}/sha256sum-amd64.txt"
          chmod 0755 "${RUNNER_TEMP}/k3s"
          grep -E '  k3s$' "${RUNNER_TEMP}/sha256sum-amd64.txt" \
            | (cd "${RUNNER_TEMP}" && sha256sum --check /dev/stdin)

          kp_kubeconfig="${RUNNER_TEMP}/kubeconfig-kuberploy-fresh"
          sudo "${RUNNER_TEMP}/k3s" server \
            --disable traefik \
            --data-dir "${RUNNER_TEMP}/k3s-data" \
            --write-kubeconfig "${kp_kubeconfig}" \
            --write-kubeconfig-mode 600 \
            >"${RUNNER_TEMP}/k3s.log" 2>&1 &
          kp_k3s_pid=$!
          export KUBECONFIG="${kp_kubeconfig}"
          for _ in {1..180}; do
            if sudo test -s "${kp_kubeconfig}"; then
              sudo chown "$(id -u):$(id -g)" "${kp_kubeconfig}"
              chmod 0600 "${kp_kubeconfig}"
              if kubectl --context default get nodes -o json 2>/dev/null \
                | jq -e '(.items | length) == 1 and all(.items[]; .status.conditions | any(.type == "Ready" and .status == "True"))' >/dev/null; then
                break
              fi
            fi
            sleep 2
          done
          [[ "$(kubectl config current-context)" == default ]]
          [[ -n "$(kubectl --context default config view --minify -o jsonpath='{.clusters[0].cluster.server}')" ]]
          kubectl --context default get nodes -o json \
            | jq -e '(.items | length) == 1 and all(.items[]; .status.conditions | any(.type == "Ready" and .status == "True"))' >/dev/null
          if kubectl --context default get namespace kuberploy-system >/dev/null 2>&1; then
            echo 'Fresh K3s unexpectedly contains kuberploy-system.' >&2
            exit 1
          fi

          mkdir -m 0700 "${RUNNER_TEMP}/release-evidence"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern release-manifest.json --dir "${RUNNER_TEMP}/release-evidence"
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            | jq -e --arg tag "${GITHUB_REF_NAME}" \
              '.tag_name == $tag and .draft == false and .immutable == true' >/dev/null
          kp_manifest="${RUNNER_TEMP}/release-evidence/release-manifest.json"
          kp_installer_digest="$(jq -er \
            '.artifacts.componentCharts[] | select(.name == "kuberploy-installer") | .ociDigest' \
            "${kp_manifest}")"
          [[ "${kp_installer_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          kp_pull_output="$(helm pull oci://ghcr.io/kuberploy/charts/kuberploy-installer \
            --version "${VERSION}" --destination "${RUNNER_TEMP}/release-evidence" 2>&1)"
          [[ "$(sed -n 's/^Digest: //p' <<<"${kp_pull_output}" | tail -n 1)" == "${kp_installer_digest}" ]]

          helm upgrade --install kuberploy-installer \
            oci://ghcr.io/kuberploy/charts/kuberploy-installer \
            --version "${VERSION}" \
            --namespace kuberploy-system \
            --create-namespace \
            --kube-context default \
            --reset-values \
            --server-side=false \
            --wait \
            --wait-for-jobs \
            --timeout 65m \
            --values examples/installer/managed-platform-values.yaml \
            --set bootstrap.applicationHealthTimeoutSeconds=3540

          [[ "$(kubectl --context default config current-context)" == default ]]
          [[ -n "$(kubectl --context default config view --minify -o jsonpath='{.clusters[0].cluster.server}')" ]]
          kubectl --context default get nodes -o json \
            | jq -e '(.items | length) == 1 and all(.items[]; .status.conditions | any(.type == "Ready" and .status == "True"))' >/dev/null
          kubectl --context default get namespace kuberploy-system -o name >/dev/null
          [[ "$(helm status kuberploy-installer --namespace kuberploy-system --kube-context default -o json | jq -r .info.status)" == deployed ]]
          kp_applications_ready=false
          for _ in {1..120}; do
            if kubectl --context default --namespace argocd get applications.argoproj.io \
              --selector app.kubernetes.io/instance=kuberploy-installer -o json \
              | jq -e '
                  ([.items[].metadata.name] | sort) == ([
                    "kuberploy-cert-manager",
                    "kuberploy-control-plane",
                    "kuberploy-edge",
                    "kuberploy-monitoring",
                    "kuberploy-postgresql",
                    "kuberploy-sealed-secrets"
                  ] | sort) and
                  all(.items[]; .status.sync.status == "Synced" and .status.health.status == "Healthy")
                ' >/dev/null; then
              kp_applications_ready=true
              break
            fi
            sleep 5
          done
          [[ "${kp_applications_ready}" == true ]]
          kubectl --context default get pods --all-namespaces \
            --selector app.kubernetes.io/part-of=kuberploy -o json \
            | jq -e '
                (.items | length) > 0 and
                all(.items[];
                  .status.phase == "Succeeded" or
                  (.status.phase == "Running" and
                   ([.status.containerStatuses[]? | .ready] | length) > 0 and
                   all(.status.containerStatuses[]?; .ready == true))) and
                ([.items[].status.containerStatuses[]?.restartCount] | add // 0) == 0
              ' >/dev/null
          if kubectl --context default get jobs --all-namespaces -o json \
            | jq -e 'any(.items[]; (.status.failed // 0) > 0)' >/dev/null; then
            echo 'Fresh K3s contains a failed Job.' >&2
            exit 1
          fi

          kubectl --context default --namespace kuberploy-system port-forward \
            service/kuberploy-api 18080:8080 >"${RUNNER_TEMP}/api-port-forward.log" 2>&1 &
          kp_port_forward_pid=$!
          for _ in {1..60}; do
            curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          [[ "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/healthz)" == 200 ]]
          [[ "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/readyz)" == 200 ]]
          curl --fail --silent --show-error http://127.0.0.1:18080/v1/meta \
            | jq -e --arg version "${VERSION}" '.version == $version' >/dev/null

          kp_bootstrap_job="$(kubectl --context default --namespace kuberploy-system get jobs.batch \
            --selector app.kubernetes.io/component=bootstrap-token -o json \
            | jq -er 'select((.items | length) == 1) | .items[0].metadata.name')"
          kp_bootstrap_token="$(kubectl --context default --namespace kuberploy-system logs "job/${kp_bootstrap_job}" \
            | sed -nE 's/^KUBERPLOY_BOOTSTRAP_TOKEN=(kp_bootstrap_[A-Za-z0-9_-]{43})$/\1/p')"
          [[ "${kp_bootstrap_token}" =~ ^kp_bootstrap_[A-Za-z0-9_-]{43}$ ]]
          kp_admin_email="qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test"
          kp_admin_password="$(openssl rand -base64 32 | tr -d '\n')Aa1!"
          kp_request="${RUNNER_TEMP}/bootstrap-request.json"
          kp_response="${RUNNER_TEMP}/bootstrap-response.json"
          kp_headers="${RUNNER_TEMP}/bootstrap-headers"
          kp_cookie_jar="${RUNNER_TEMP}/bootstrap-cookies"
          touch "${kp_request}" "${kp_response}" "${kp_headers}" "${kp_cookie_jar}"
          jq -n \
            --arg token "${kp_bootstrap_token}" \
            --arg email "${kp_admin_email}" \
            --arg password "${kp_admin_password}" \
            '{token:$token,email:$email,displayName:"Qualification Admin",password:$password}' \
            >"${kp_request}"
          chmod 0600 "${kp_request}" "${kp_response}" "${kp_headers}" "${kp_cookie_jar}"
          [[ "$(curl --silent --show-error --cookie-jar "${kp_cookie_jar}" --dump-header "${kp_headers}" \
            --output "${kp_response}" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data-binary "@${kp_request}" \
            http://127.0.0.1:18080/v1/auth/bootstrap)" == 201 ]]
          jq -e --arg email "${kp_admin_email}" \
            '.email == $email and .displayName == "Qualification Admin" and .role == "platform-admin" and (has("username") | not)' \
            "${kp_response}" >/dev/null
          kp_csrf="$(awk 'tolower($1)=="x-csrf-token:" {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "${kp_headers}")"
          [[ -n "${kp_csrf}" ]]
          [[ "$(curl --silent --show-error --output "${kp_response}" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data-binary "@${kp_request}" \
            http://127.0.0.1:18080/v1/auth/bootstrap)" == 409 ]]
          jq -e '.code == "BootstrapConsumed"' "${kp_response}" >/dev/null
          curl --fail --silent --show-error --cookie "${kp_cookie_jar}" \
            http://127.0.0.1:18080/v1/me \
            | jq -e --arg email "${kp_admin_email}" \
              '.email == $email and .displayName == "Qualification Admin" and .authentication.kind == "session" and (has("username") | not)' >/dev/null
          [[ "$(curl --silent --show-error --cookie "${kp_cookie_jar}" --cookie-jar "${kp_cookie_jar}" \
            --output /dev/null --write-out '%{http_code}' --request POST \
            --header "X-CSRF-Token: ${kp_csrf}" http://127.0.0.1:18080/v1/auth/logout)" == 204 ]]
          [[ "$(curl --silent --show-error --cookie "${kp_cookie_jar}" \
            --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/v1/me)" == 401 ]]
          jq -n --arg email "${kp_admin_email}" --arg password "${kp_admin_password}" \
            '{email:$email,password:$password}' >"${kp_request}"
          [[ "$(curl --silent --show-error --cookie-jar "${kp_cookie_jar}" \
            --output "${kp_response}" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data-binary "@${kp_request}" \
            http://127.0.0.1:18080/v1/auth/login)" == 200 ]]
          jq -e --arg email "${kp_admin_email}" \
            '.email == $email and .displayName == "Qualification Admin" and (has("username") | not)' \
            "${kp_response}" >/dev/null
          echo "Fresh remote K3s installer qualification passed for ${VERSION}."

  repair-image-tags:
    name: Repair readable image tags
    needs: release-contract
    if: needs.release-contract.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.repair_release_tag != '' && github.repository == 'kuberploy/kuberploy'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable release and repair tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.repair_release_tag }}
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          kp_release_json="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          jq -e --arg tag "${RELEASE_TAG}" \
            '.tag_name == $tag and .draft == false and .immutable == true' \
            <<<"${kp_release_json}" >/dev/null
          kp_tag_commit="$(git rev-parse HEAD)"
          mkdir release-repair
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern release-manifest.json --dir release-repair
          jq -e \
            --arg tag "${RELEASE_TAG}" \
            --arg commit "${kp_tag_commit}" \
            '.schemaVersion == "1.0.0" and
             .release.tag == $tag and
             .source.commit == $commit and
             (.artifacts.images | length == 6)' \
            release-repair/release-manifest.json >/dev/null
          while IFS= read -r kp_record; do
            kp_component="$(jq -er .component <<<"${kp_record}")"
            kp_reference="$(jq -er .reference <<<"${kp_record}")"
            [[ "${kp_reference}" == "ghcr.io/kuberploy/kuberploy-${kp_component}" ]]
            kp_digest="$(jq -er .digest <<<"${kp_record}")"
            [[ "${kp_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
            jq -e '.platforms == ["linux/amd64", "linux/arm64"]' <<<"${kp_record}" >/dev/null
            kp_manifest="$(docker buildx imagetools inspect \
              "${kp_reference}@${kp_digest}" --format '{{json .Manifest}}')"
            jq -e '.mediaType == "application/vnd.oci.image.index.v1+json" and
                   (.manifests | length == 2) and
                   ([.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"])' \
              <<<"${kp_manifest}" >/dev/null
            kp_version="${RELEASE_TAG#v}"
            docker buildx imagetools create \
              --tag "${kp_reference}:${kp_version}" "${kp_reference}@${kp_digest}"
            kp_repaired_digest="$(docker buildx imagetools inspect \
              "${kp_reference}:${kp_version}" --format '{{json .Manifest}}' | jq -er .digest)"
            [[ "${kp_repaired_digest}" == "${kp_digest}" ]]
          done < <(jq -c '.artifacts.images[]' release-repair/release-manifest.json)
