name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - name: Install chart test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep jq
          curl --fail --silent --show-error --location \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 \
            --output "${RUNNER_TEMP}/yq"
          chmod 0755 "${RUNNER_TEMP}/yq"
          sudo install -m 0755 "${RUNNER_TEMP}/yq" /usr/local/bin/yq
      - name: Prepare locked Helm dependencies
        run: ./scripts/helm/prepare-dependencies.sh
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal migrations 2>/dev/null)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  helm:
    name: Helm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - name: Prepare locked Helm dependencies
        run: ./scripts/helm/prepare-dependencies.sh
      - name: Lint and render charts
        run: make helm-lint
