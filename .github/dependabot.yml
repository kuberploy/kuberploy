version: 2
# Routine version-update PRs are disabled everywhere below
# (open-pull-requests-limit: 0). GitHub's separate Dependabot security-updates
# feature (Settings > Code security > Dependabot > Dependabot security
# updates) still opens PRs automatically, independent of this file, whenever
# a dependency has a known vulnerability. This file only controls the
# routine/non-security version-bump PRs.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      go-runtime:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /release/tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      release-tools:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 0
    groups:
      web-runtime:
        dependency-type: production
      web-tooling:
        dependency-type: development
    ignore:
      # Keep types on the explicitly selected Node 26 runtime line.
      - dependency-name: "@types/node"
        versions: [">=27"]

  - package-ecosystem: npm
    directory: /migrations
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 0
    groups:
      migration-tooling:
        patterns: ["*"]
    ignore:
      - dependency-name: "prisma"
        versions: [">=8"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /build/package
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "alpine"
        versions: [">=3.25"]
      - dependency-name: "docker"
        versions: [">=30"]
      - dependency-name: "golang"
        versions: [">=1.27"]
      - dependency-name: "node"
        versions: [">=27"]
      - dependency-name: "registry"
        versions: [">=4"]

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Move the frontend builder only when the selected production line
      # changes and the complete toolchain matrix has passed.
      - dependency-name: node
        versions: [">=27"]
      - dependency-name: nginx
        versions: [">=1.32"]
