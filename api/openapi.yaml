stallation state","description":"Returns a short-lived signed installation state and the fixed GitHub App installation URL. It neither accepts a callback URL nor persists an installation. GitHub must return this state and installation_id to the separately configured Setup URL before OAuth begins. The response also copies the authenticated opaque session into a 15-minute HttpOnly, host-only, exact-Setup-path SameSite=Lax cookie so GitHub's cross-site top-level redirect remains human-session-bound without weakening the primary SameSite=Strict cookie.","x-kuberploy-permission":"platform.admin","x-kuberploy-effect":"source-authorization","x-kuberploy-risk":"high","x-kuberploy-idempotency":"required","x-kuberploy-confirmation":"request-body","x-kuberploy-audience":["human"],"parameters":[{"$ref":"#/components/parameters/CommandIdempotencyKey"},{"$ref":"#/components/parameters/SessionCSRFToken"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/BeginGitHubSetup"}}}},"responses":{"200":{"description":"Actor-bound setup authorization and short-lived browser-flow session","headers":{"Cache-Control":{"schema":{"const":"no-store"}},"Set-Cookie":{"description":"Sets kuberploy_github_setup_session as HttpOnly, SameSite=Lax, Path=/v1/github/installations/setup, Max-Age=900, and Secure on HTTPS public origins; an old callback-path copy is expired.","schema":{"type":"string","x-kuberploy-sensitive":true}},"Idempotent-Replay":{"schema":{"type":"string","const":"true"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/GitHubSetupAuthorization"}}}},"400":{"$ref":"#/components/responses/Problem"},"403":{"$ref":"#/components/responses/Problem"},"409":{"$ref":"#/components/responses/Problem"},"422":{"$ref":"#/components/responses/Problem"},"429":{"$ref":"#/components/responses/RateLimitExceeded"},"503":{"$ref":"#/components/responses/RateLimitUnavailable"}}}},"/v1/github/installations/setup":{"get":{"operationId":"continueGitHubAppInstallationSetup","tags":["GitHub"],"security":[{"githubSetupSession":[]}],"summary":"Consume the GitHub Setup URL return and begin actor-bound OAuth","description":"Accepts installation_id only on GitHub's documented Setup URL return. The dedicated exact-Setup-path browser cookie must still resolve to the initiating durable human session. After consuming the one-time installation state, the server derives a second actor/account/installation-bound OAuth state and redirects only to GitHub's fixed authorization endpoint and the operator-fixed callback URI, rotating the browser session copy onto the exact callback path.","x-kuberploy-permission":"platform.admin","x-kuberploy-effect":"source-verification","x-kuberploy-risk":"high","x-kuberploy-idempotency":"single-use-state","x-kuberploy-confirmation":"provider-callback","x-kuberploy-audience":["human"],"parameters":[{"name":"state","in":"query","required":true,"schema":{"type":"string","minLength":64,"maxLength":4096,"x-kuberploy-sensitive":true}},{"name":"installation_id","in":"query","required":true,"schema":{"type":"integer","format":"int64","minimum":1}},{"name":"setup_action","in":"query","required":false,"schema":{"type":"string","enum":["install","update"]}}],"responses":{"303":{"description":"Continue at the fixed GitHub OAuth authorization endpoint and rotate the bounded browser-flow cookie","headers":{"Location":{"required":true,"schema":{"type":"string","format":"uri","pattern":"^https://github\\.com/login/oauth/authorize\\?"}},"Set-Cookie":{"description":"Expires the Setup-path cookie and sets the same revocable session copy at Path=/v1/github/installations/callback.","schema":{"type":"string","x-kuberploy-sensitive":true}},"Cache-Control":{"schema":{"const":"no-store"}},"Referrer-Policy":{"required":true,"schema":{"const":"no-referrer"}}}},"400":{"$ref":"#/components/responses/Problem"},"403":{"$ref":"#/components/responses/Problem"},"503":{"$ref":"#/components/responses/Problem"}}}},"/v1/github/installations/callback":{"get":{"operationId":"completeGitHubAppInstallationCallback","tags":["GitHub"],"security":[{"githubSetupSession":[]}],"summary":"Verify the GitHub OAuth callback against the initiating human session","description":"Accepts only code and the second OAuth-purpose state, and requires the dedicated path-scoped browser cookie to resolve to the same durable human session. The installation id is derived server-side from signed state, then the code is exchanged inside the provider boundary and the authenticated GitHub user's installation list must prove exact ownership. The verified one-time handoff is placed only in a bounded HttpOnly same-site cookie scoped to the link endpoint; it is never exposed to browser JavaScript, URLs, or response bodies.","x-kuberploy-permission":"platform.admin","x-kuberploy-effect":"source-verification","x-kuberploy-risk":"high","x-kuberploy-idempotency":"single-use-state","x-kuberploy-confirmation":"provider-callback","x-kuberploy-audience":["human"],"parameters":[{"name":"state","in":"query","required":true,"schema":{"type":"string","minLength":64,"maxLength":4096,"x-kuberploy-sensitive":true}},{"name":"code","in":"query","required":true,"schema":{"type":"string","minLength":16,"maxLength":512,"x-kuberploy-sensitive":true}}],"responses":{"303":{"description":"Verified setup continues at the fixed same-origin UI completion route","headers":{"Location":{"required":true,"schema":{"type":"string","const":"/github/setup/complete"}},"Cache-Control":{"schema":{"const":"no-store"}},"Referrer-Policy":{"required":true,"schema":{"const":"no-referrer"}},"Set-Cookie":{"description":"Expires the callback browser-session copy and sets kuberploy_github_setup_handoff as a host-only HttpOnly SameSite=Strict cookie scoped exactly to /v1/github/installations/link for no more than 15 minutes.","schema":{"type":"string","x-kuberploy-sensitive":true}}}},"400":{"$ref":"#/components/responses/Problem"},"403":{"$ref":"#/components/responses/Problem"},"502":{"$ref":"#/components/responses/Problem"},"503":{"$ref":"#/components/responses/Problem"}}}},"/v1/github/installations/link":{"post":{"operationId":"linkVerifiedGitHubAppInstallation","tags":["GitHub"],"security":[{"cookieAuth":[],"githubSetupHandoff":[]}],"summary":"Consume the path-scoped verified setup handoff and persist installation metadata","description":"Requires an empty request body. The server consumes the one-time HttpOnly handoff cookie, creates a private installation owned by the current human, persists only provider identities and repository metadata, then clears the cookie. Provider credentials and clear handoff bytes are never exposed to JavaScript, persisted, audited, or replayed.","x-kuberploy-permission":"platform.admin","x-kuberploy-effect":"source-access","x-kuberploy-risk":"high","x-kuberploy-idempotency":"required","x-kuberploy-confirmation":"provider-cookie","x-kuberploy-audience":["human"],"parameters":[{"$ref":"#/components/parameters/CommandIdempotencyKey"},{"$ref":"#/components/parameters/SessionCSRFToken"}],"responses":{"201":{"description":"Verified installation and repositories linked","headers":{"Location":{"schema":{"type":"string"}},"Cache-Control":{"schema":{"const":"no-store"}},"Set-Cookie":{"description":"Expires the one-time link handoff cookie after success.","schema":{"type":"string","x-kuberploy-sensitive":true}},"Idempotent-Replay":{"schema":{"type":"string","const":"true"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LinkedGitHubSetup"}}}},"400":{"$ref":"#/components/responses/Problem"},"401":{"$ref":"#/components/responses/Problem"},"403":{"$ref":"#/components/responses/Problem"},"409":{"$ref":"#/components/responses/Problem"},"422":{"$ref":"#/components/responses/Problem"},"429":{"$ref":"#/components/responses/RateLimitExceeded"},"503":{"$ref":"#/components/responses/RateLimitUnavailable"}}}},"/v1/github/installations/{id}/repositories":{"get":{"operationId":"listGitHubIns