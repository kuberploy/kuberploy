omponents/responses/RateLimitUnavailable"}}}},"/v1/teams/{teamId}/members/{userId}":{"delete":{"operationId":"removeTeamMember","tags":["Teams"],"security":[{"cookieAuth":[]}],"summary":"Remove a team member without allowing the team to lose its final owner","x-kuberploy-permission":"grants.manage","x-kuberploy-effect":"team-membership","x-kuberploy-risk":"high","parameters":[{"name":"teamId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"userId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"$ref":"#/components/parameters/SessionCSRFToken"}],"responses":{"204":{"description":"Membership removed and the affected user's stale sessions revoked; also returned when the authorized caller repeats an already-completed removal"},"403":{"$ref":"#/components/responses/Problem"},"404":{"$ref":"#/components/responses/Problem"},"409":{"description":"The target is the team's sole owner","content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}},"429":{"$ref":"#/components/responses/RateLimitExceeded"},"503":{"$ref":"#/components/responses/RateLimitUnavailable"}}}},"/v1/github/installations":{"get":{"operationId":"listAccessibleGitHubInstallations","tags":["GitHub"],"security":[{"cookieAuth":[]}],"description":"Returns private installations owned by the caller and team-shared installations accessible through current membership. Platform administrators see all.","responses":{"200":{"description":"Backend-filtered installation metadata; never credentials or private keys","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GitHubInstallationList"}}}}}},"post":{"operationId":"registerGitHubInstallationMetadata","tags":["GitHub"],"security":[{"cookieAuth":[]}],"summary":"Administratively register externally verified installation metadata","description":"MVP administrative seam for metadata obtained out of band. It stores no credential and does not by itself enable repository c