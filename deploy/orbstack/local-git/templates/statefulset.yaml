{{- if hasSuffix (lower .Values.image.reference) (printf ":%s" "latest") }}
{{- fail "image.reference must not use a floating latest tag" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kuberploy-git
  labels:
    app.kubernetes.io/name: kuberploy-local-git
    app.kubernetes.io/instance: {{ .Release.Name }}
    kuberploy.io/test-run: {{ .Values.testRun | quote }}
spec:
  serviceName: kuberploy-git
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberploy-local-git
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberploy-local-git
        app.kubernetes.io/instance: {{ .Release.Name }}
        kuberploy.io/test-run: {{ .Values.testRun | quote }}
    spec:
      serviceAccountName: kuberploy-git
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-repository
          image: {{ .Values.image.reference | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              repository="/git/repositories/{{ .Values.repositoryName }}"
              mkdir -p /git/repositories
              if [ ! -f "${repository}/HEAD" ]; then
                git init --bare --initial-branch=main "${repository}"
                touch "${repository}/git-daemon-export-ok"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /git
            - name: tmp
              mountPath: /tmp
      containers:
        - name: git-daemon
          image: {{ .Values.image.reference | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/git"]
          args:
            - daemon
            - --reuseaddr
            - --verbose
            - --export-all
            - --enable=receive-pack
            - --base-path=/git/repositories
            - --listen=0.0.0.0
            - --port=9418
            - /git/repositories
          ports:
            - name: git
              containerPort: 9418
          readinessProbe:
            tcpSocket:
              port: git
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: git
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /git
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          kuberploy.io/test-run: {{ .Values.testRun | quote }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
