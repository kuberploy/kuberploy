apiVersion: v1
kind: Service
metadata:
  name: kuberploy-postgresql
  labels:
    {{- include "kuberploy-local-dependencies.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: kuberploy-valkey
  labels:
    {{- include "kuberploy-local-dependencies.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
