# Overlay for the protected Argo desired-state render tests. It is intentionally
# applied on top of the GitHub App + Git projection fixture assembled by the
# test so the dependency chain cannot be enabled independently.
config:
  platformGitBinding:
    enabled: true
    bindingID: 11111111-1111-4111-8111-111111111111
    clusterID: 22222222-2222-4222-8222-222222222222
  argoObservation:
    enabled: true
    namespace: kuberploy-e2e-render
    pollIntervalSeconds: 45
  environmentFoundation:
    enabled: true
    platformBindingID: 11111111-1111-4111-8111-111111111111
    clusterID: 22222222-2222-4222-8222-222222222222
    psaVersion: v1.31
    pollIntervalSeconds: 2
  argoDesiredState:
    enabled: true
    platformBindingID: 11111111-1111-4111-8111-111111111111
    clusterID: 22222222-2222-4222-8222-222222222222
    namespace: kuberploy-e2e-render
    runtimeChartRepository: oci://ghcr.io/kuberploy/charts
    runtimeChartVersion: 0.1.0-rc.294
    runtimeChartDigest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    pollIntervalSeconds: 2
    catalogMaxAgeSeconds: 300
components:
  api:
    image:
      reference: ghcr.io/kuberploy/kuberploy-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  worker:
    image:
      reference: ghcr.io/kuberploy/kuberploy-worker@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
builder:
  controllerServiceAccount:
    namespace: kuberploy-e2e-render
    name: argo-desired-worker
