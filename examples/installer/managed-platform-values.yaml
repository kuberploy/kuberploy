# Kuberploy managed platform installer values.
#
# Kubernetes Service/API endpoints remain explicit cluster-owned CIDRs. Public
# GitHub, Git, OCI, and registry CIDR lists are optional: empty uses dual-stack
# public egress on required ports with Kubernetes API destinations excluded.
# Supply lists only when cluster infrastructure wants narrower egress.
bootstrap:
  valkey:
    enabled: true
  argoCD:
    enabled: true
    mode: managed
    managedPrerequisitesConfirmed: true
  controlPlaneToken:
    mode: generated
    kubeAPIServerCIDRs: []

cluster:
  kubeAPIServerCIDRs: []

source:
  chartRepository: ghcr.io/kuberploy/charts
  valuesRepository: https://github.com/kuberploy/kuberploy.git
  valuesRevision: v0.1.0-rc.398

publicEndpoint:
  enabled: false
  hostname: ""
  tls:
    enabled: false
    manageCertificate: true
    secretName: ""
    clusterIssuerName: ""
    # Required when TLS is enabled; for example, platform-ops@example.com.
    accountEmail: ""

integrations:
  github:
    enabled: false
    appID: 0
    clientID: ""
    appSlug: ""
    secretName: ""
    controlPlaneEgressCIDRs: []
    sourceEgressCIDRs: []
    registryEgressCIDRs: []
  registry:
    enabled: false
    authSecretName: ""
    secretRevision: ""
    exposureMode: internal
    manageCertificate: true
    endpoint: ""
    tlsSecretName: ""
    clusterIssuerName: ""
    loadBalancer:
      annotations: {}
      class: ""
      ip: ""
      sourceRanges: []

components:
  controlPlane:
    enabled: true
    mode: managed
    adoptionConfirmed: false
    expectedPackageVersion: 0.1.0-rc.398
    valueFiles: []
  postgresql:
    enabled: true
    mode: managed
    adoptionConfirmed: false
    expectedPackageVersion: 0.1.0-rc.398
    valueFiles:
      - examples/installer/postgresql.yaml
  valkey:
    enabled: true
    mode: managed
    adoptionConfirmed: false
    expectedPackageVersion: 0.1.0-rc.398
    valueFiles: []
  edge:
    enabled: true
    mode: managed
    adoptionConfirmed: false
    expectedPackageVersion: 0.1.0-rc.398
    valueFiles: []
  certManager:
    enabled: true
    mode: managed
    adoptionConfirmed: false
    expectedPackageVersion: 0.1.0-rc.398
    valueFiles: []
  sealedSecrets:
    enabled: true
    mode: managed
    adoptionConfirmed: false
    expectedPackageVersion: 0.1.0-rc.398
    valueFiles: []
  monitoring:
    enabled: true
    mode: managed
    adoptionConfirmed: false
    expectedPackageVersion: 0.1.0-rc.398
    valueFiles: []

argoCD:
  argoFoundation:
    networkPolicy:
      kubeAPIServerCIDRs: []
      repositoryEgressCIDRs: []
