{{- if and .Values.edge.networkPolicy.enabled .Values.edge.traefik.managed }}
{{- $apiCIDRs := .Values.edge.networkPolicy.kubeAPIServerCIDRs }}
{{- if empty $apiCIDRs }}{{- $apiCIDRs = list "0.0.0.0/0" "::/0" }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-traefik
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberploy-edge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes: [Ingress, Egress]
  ingress:
    - {{- with .Values.edge.networkPolicy.publicIngressCIDRs }}
      from:
        {{- range uniq (sortAlpha .) }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- end }}
      ports:
        - {port: 8000, protocol: TCP}
        - {port: 8443, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kuberploy.io/monitoring-namespace: "true"
      ports:
        - {port: 9100, protocol: TCP}
  egress:
    # The public Kuberploy Ingress lives in this shared namespace. Permit only
    # the exact web/API backends and port; do not grant arbitrary same-namespace
    # access.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kuberploy
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, web]
      ports:
        - {port: 8080, protocol: TCP}
    # cert-manager creates a short-lived, exactly labelled HTTP-01 solver in
    # the Ingress namespace. Traefik needs only its fixed solver port.
    - to:
        - podSelector:
            matchLabels:
              acme.cert-manager.io/http01-solver: "true"
      ports:
        - {port: 8089, protocol: TCP}
    # The optional managed OCI registry shares the platform namespace. Permit
    # only its exact server-owned labels and Distribution port.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kuberploy-registry
              app.kubernetes.io/component: registry
      ports:
        - {port: 5000, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kuberploy.io/runtime-namespace: "true"
          podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        {{- range $apiCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-private-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberploy-edge.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
{{- end }}
