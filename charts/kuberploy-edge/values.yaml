edge:
  namespace:
    create: true
  traefik:
    # Exactly one must be true. Managed is the P0 LoadBalancer profile.
    managed: true
    adoptExisting: false
    # Adoption confirms compatible Ingress and traefik.io/v1alpha1 CRD providers.
    crdProviderConfirmed: false
    # sslip.io is disabled when this key is absent. To enable it, configure
    # exactly one mode; staticPublicIPv4 is accepted only by verified-static-ip.
    # sslip:
    #   mode: auto-first-ip
  networkPolicy:
    enabled: false
    # The Kubernetes API endpoint CIDRs are cluster-specific and deliberately
    # have no broad default. 0.0.0.0/0 and ::/0 are rejected here.
    kubeAPIServerCIDRs: []
    publicIngressCIDRs:
      - 0.0.0.0/0
      - ::/0

traefik:
  commonLabels: {}
  namespaceOverride: ""
  instanceLabelOverride: ""
  nameOverride: traefik
  fullnameOverride: ""
  image:
    registry: docker.io
    repository: library/traefik
    tag: v3.7.10
    pullPolicy: IfNotPresent
  versionOverride: v3.7.10
  deployment:
    enabled: true
    kind: Deployment
    replicas: 2
    annotations:
      # The edge observer compares this release-owned render identity instead
      # of Kubernetes-defaulted live JSON, which is not stable across clusters.
      kuberploy.io/edge-spec-digest: sha256:c9d587fd919c76a5d78991b0f23a3b5e3562003e532287b07d3194292e27753b
    shareProcessNamespace: false
    additionalContainers: []
    additionalVolumes: []
    initContainers: []
    podLabels: {}
    podAnnotations: {}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
  ingressClass:
    enabled: true
    isDefaultClass: false
    name: traefik
  gateway:
    enabled: false
  experimental:
    plugins: {}
    localPlugins: {}
  hub:
    enabled: false
    token: ""
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: false
      allowExternalNameServices: false
      allowEmptyServices: false
      crossProviderNamespaces: []
    kubernetesIngress:
      enabled: true
      allowExternalNameServices: false
      allowEmptyServices: false
      crossProviderNamespaces: []
      ingressClass: traefik
      publishedService:
        enabled: true
    kubernetesGateway:
      enabled: false
    file:
      enabled: false
      content: {}
    kubernetesIngressNGINX:
      enabled: false
  api:
    dashboard: false
    insecure: false
    debug: false
  ingressRoute:
    dashboard:
      enabled: false
    healthcheck:
      enabled: false
  log:
    format: json
    level: INFO
  accessLog:
    enabled: true
    format: json
    fields:
      names: {}
      headers:
        defaultMode: drop
        names: {}
      queryParameters:
        defaultMode: drop
  metrics:
    addInternals: false
    prometheus:
      entryPoint: metrics
      addEntryPointsLabels: true
      addRoutersLabels: false
      addServicesLabels: true
      buckets: "0.1,0.3,1.2,5.0"
      manualRouting: false
      headerLabels: {}
      service:
        enabled: true
        labels:
          kuberploy.io/monitoring-source: protected
        annotations: {}
      # The installer orders monitoring CRDs before the edge release. Keeping
      # this true also lets the independently packaged chart be rendered and
      # verified without ambient cluster discovery.
      disableAPICheck: true
      serviceMonitor:
        # Monitoring is an optional sibling release. The installer enables
        # this only when the monitoring component is selected; standalone edge
        # installs remain usable on clusters without the Prometheus CRD.
        enabled: false
        apiVersion: monitoring.coreos.com/v1
        metricRelabelings:
          - action: keep
            sourceLabels: [__name__]
            regex: traefik_service_requests_total|traefik_service_request_duration_seconds_bucket
        relabelings: []
        jobLabel: ""
        interval: 30s
        honorLabels: false
        scrapeTimeout: 10s
        honorTimestamps: false
        enableHttp2: false
        followRedirects: false
        additionalLabels:
          kuberploy.io/monitoring-source: protected
        namespace: kuberploy-monitoring
        namespaceSelector:
          matchNames: [kuberploy-system]
      prometheusRule:
        enabled: false
  ports:
    traefik:
      expose:
        default: false
    web:
      port: 8000
      expose:
        default: true
      exposedPort: 80
      protocol: TCP
      http:
        redirections:
          entryPoint: {}
      forwardedHeaders:
        insecure: false
      proxyProtocol:
        insecure: false
    websecure:
      port: 8443
      expose:
        default: true
      exposedPort: 443
      protocol: TCP
      http:
        middlewares: []
        tls:
          enabled: true
          options: ""
          certResolver: ""
          domains: []
      http3:
        enabled: false
      forwardedHeaders:
        insecure: false
      proxyProtocol:
        insecure: false
    metrics:
      expose:
        default: false
  service:
    enabled: true
    single: true
    annotations: {}
    spec:
      type: LoadBalancer
    additionalServices: {}
  rbac:
    enabled: true
    namespaced: false
    aggregateTo: []
  serviceAccount:
    name: ""
  serviceAccountAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  podSecurityContext:
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  hostNetwork: false
  persistence:
    enabled: false
  certificatesResolvers: {}
  tlsOptions: {}
  tlsStore: {}
  volumes: []
  env: []
  envFrom: []
  additionalArguments: []
  additionalVolumeMounts: []
  extraObjects: []
