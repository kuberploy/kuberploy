{{- define "kuberploy-runtime.workloadBase" -}}
{{- $strategy := .Values.spec.runtime.strategy | default dict -}}
{{- $strategyType := get $strategy "type" | default "RollingUpdate" -}}
{{- $workloadType := .Values.spec.runtime.workloadType | default "Deployment" -}}
apiVersion: apps/v1
kind: {{ $workloadType }}
metadata:
  name: {{ include "kuberploy-runtime.appName" . }}
  labels:
    {{- include "kuberploy-runtime.labels" . | nindent 4 }}
  annotations:
    kuberploy.io/application-id: {{ .Values.metadata.id | quote }}
spec:
  replicas: {{ .Values.spec.runtime.replicas }}
  revisionHistoryLimit: 5
  {{- if eq $workloadType "StatefulSet" }}
  serviceName: {{ include "kuberploy-runtime.appName" . }}-headless
  podManagementPolicy: {{ .Values.spec.runtime.podManagementPolicy | default "OrderedReady" }}
  updateStrategy:
    type: {{ $strategyType }}
  {{- else }}
  strategy:
    type: {{ $strategyType }}
    {{- if ne $strategyType "Recreate" }}
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kuberploy-runtime.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kuberploy-runtime.labels" . | nindent 8 }}
      annotations:
        kuberploy.io/config-map: {{ include "kuberploy-runtime.configMapName" . | quote }}
        kuberploy.io/config-revision: {{ .Values.spec.runtime.configRevision | default "unrecorded" | quote }}
    spec:
      serviceAccountName: {{ include "kuberploy-runtime.appName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.spec.delivery.registryPull }}
      imagePullSecrets:
        - name: {{ include "kuberploy-runtime.imagePullSecretName" $ }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.spec.runtime.terminationGracePeriodSeconds | default 30 }}
      {{- with .Values.spec.runtime.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.spec.runtime.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.spec.runtime.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.spec.runtime.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.spec.runtime.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: {{ include "kuberploy-runtime.image" . | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          {{- with .Values.spec.runtime.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.spec.runtime.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.spec.runtime.workingDirectory }}
          workingDir: {{ . | quote }}
          {{- end }}
          ports:
            {{- range .Values.spec.runtime.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          {{- with (include "kuberploy-runtime.effectiveEnv" . | fromJsonArray) }}
          env:
            {{- range . }}
            - name: {{ .name }}
              valueFrom:
                {{- if hasKey . "value" }}
                configMapKeyRef:
                  name: {{ include "kuberploy-runtime.configMapName" $ }}
                  key: {{ .name }}
                  optional: false
                {{- else }}
                secretKeyRef:
                  name: {{ include "kuberploy-runtime.secretName" .valueFrom.secretBindingRef }}
                  key: {{ .valueFrom.secretBindingRef.key }}
                  optional: false
                {{- end }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.spec.runtime.resources | nindent 12 }}
          {{- with .Values.spec.runtime.probes }}
          {{- with .startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end -}}
{{- $base := include "kuberploy-runtime.workloadBase" . | fromYaml -}}
{{- $overrides := .Values.spec.overrides | default dict -}}
{{- $override := get $overrides "deployment" | default dict -}}
{{- if and (eq (.Values.spec.runtime.workloadType | default "Deployment") "StatefulSet") (gt (len $override) 0) -}}
  {{- fail "spec.overrides.deployment is unavailable for a StatefulSet workload" -}}
{{- end -}}
{{- $resource := mergeOverwrite (deepCopy $base) (deepCopy $override) -}}
{{- $_ := set $resource "apiVersion" (get $base "apiVersion") -}}
{{- $_ := set $resource "kind" (get $base "kind") -}}
{{- $metadata := get $resource "metadata" -}}
{{- $baseMetadata := get $base "metadata" -}}
{{- $_ := set $metadata "name" (get $baseMetadata "name") -}}
{{- $_ := unset $metadata "namespace" -}}
{{- $labels := mergeOverwrite (deepCopy (get $metadata "labels" | default dict)) (deepCopy (get $baseMetadata "labels")) -}}
{{- $_ := set $metadata "labels" $labels -}}
{{- $annotations := mergeOverwrite (deepCopy (get $metadata "annotations" | default dict)) (deepCopy (get $baseMetadata "annotations" | default dict)) -}}
{{- $_ := set $metadata "annotations" $annotations -}}
{{- $resourceSpec := get $resource "spec" -}}
{{- $baseSpec := get $base "spec" -}}
{{- $_ := set $resourceSpec "selector" (deepCopy (get $baseSpec "selector")) -}}
{{- $template := get $resourceSpec "template" -}}
{{- $baseTemplate := get $baseSpec "template" -}}
{{- $templateMetadata := get $template "metadata" -}}
{{- $baseTemplateMetadata := get $baseTemplate "metadata" -}}
{{- $templateLabels := mergeOverwrite (deepCopy (get $templateMetadata "labels" | default dict)) (deepCopy (get $baseTemplateMetadata "labels")) -}}
{{- $_ := set $templateMetadata "labels" $templateLabels -}}
{{- $templateAnnotations := mergeOverwrite (deepCopy (get $templateMetadata "annotations" | default dict)) (deepCopy (get $baseTemplateMetadata "annotations" | default dict)) -}}
{{- $_ := set $templateMetadata "annotations" $templateAnnotations -}}
{{- $podSpec := get $template "spec" -}}
{{- $basePodSpec := get $baseTemplate "spec" -}}
{{- $_ := set $podSpec "serviceAccountName" (get $basePodSpec "serviceAccountName") -}}
{{- range $field := list "hostNetwork" "hostPID" "hostIPC" "hostUsers" -}}
  {{- $_ := unset $podSpec $field -}}
{{- end -}}
{{- $containers := get $podSpec "containers" -}}
{{- if or (not (kindIs "slice" $containers)) (eq (len $containers) 0) -}}
  {{- fail "spec.overrides.deployment must retain one application container" -}}
{{- end -}}
{{- $baseApplication := index (get $basePodSpec "containers") 0 -}}
{{- $application := index $containers 0 -}}
{{- if not (kindIs "map" $application) -}}
  {{- fail "spec.overrides.deployment first container must be a mapping" -}}
{{- end -}}
{{- $_ := set $application "name" (get $baseApplication "name") -}}
{{- $_ := set $application "image" (get $baseApplication "image") -}}
{{- $_ := set $application "securityContext" (deepCopy (get $baseApplication "securityContext")) -}}
{{- toYaml $resource -}}
