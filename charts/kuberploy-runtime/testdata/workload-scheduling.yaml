apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
kuberployExpectedIdentity:
  projectId: 11111111-1111-4111-8111-111111111111
  environmentId: 22222222-2222-4222-8222-222222222222
  applicationId: 33333333-3333-4333-8333-333333333333
metadata:
  id: 33333333-3333-4333-8333-333333333333
  name: scheduled-service
spec:
  projectId: 11111111-1111-4111-8111-111111111111
  applicationId: 33333333-3333-4333-8333-333333333333
  environmentId: 22222222-2222-4222-8222-222222222222
  delivery:
    mode: image
    release:
      repository: registry.example.test/team/service
      digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  runtime:
    replicas: 2
    ports:
      - name: http
        containerPort: 8080
        servicePort: 80
        protocol: TCP
    env:
      - name: LOG_LEVEL
        value: info
      - name: DATABASE_PASSWORD
        valueFrom:
          secretBindingRef:
            bindingId: 44444444-4444-4444-8444-444444444444
            name: database
            key: password
            version: 3
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 512Mi
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: karpenter.sh/capacity-type
                  operator: In
                  values: [on-demand]
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 75
            preference:
              matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values: [zone-a, zone-b]
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                kuberploy.io/application: 33333333-3333-4333-8333-333333333333
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 40
            podAffinityTerm:
              topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  kuberploy.io/application: 33333333-3333-4333-8333-333333333333
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            kuberploy.io/application: 33333333-3333-4333-8333-333333333333
    tolerations:
      - key: workload.kuberploy.io/class
        operator: Equal
        value: application
        effect: NoSchedule
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
