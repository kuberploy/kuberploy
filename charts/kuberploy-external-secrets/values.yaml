secretFoundation:
  operator:
    managed: false
    adoptExisting: true
    capabilitiesConfirmed: false
  namespace:
    create: true
  networkPolicy:
    enabled: true
    kubeAPIServerCIDRs: []
    providerHTTPSCIDRs: []
    monitoringNamespace: kuberploy-monitoring

externalSecrets:
  global:
    nodeSelector: {}
    tolerations: []
    topologySpreadConstraints: []
    affinity: {}
    hostAliases: []
    podLabels: {}
    podAnnotations: {}
    imagePullSecrets: []
    repository: ""
    compatibility:
      openshift:
        adaptSecurityContext: disabled
  replicaCount: 2
  bitwarden-sdk-server:
    enabled: false
  revisionHistoryLimit: 3
  image:
    repository: ghcr.io/external-secrets/external-secrets
    pullPolicy: IfNotPresent
    tag: v2.8.0
    flavour: ""
  installCRDs: true
  crds:
    createClusterExternalSecret: false
    createClusterSecretStore: false
    createSecretStore: true
    createClusterGenerator: false
    createClusterPushSecret: false
    createPushSecret: false
    annotations:
      helm.sh/resource-policy: keep
    conversion:
      enabled: false
    unsafeServeV1Beta1: false
  imagePullSecrets: []
  nameOverride: external-secrets
  fullnameOverride: kuberploy-external-secrets
  namespaceOverride: ""
  commonLabels: {}
  leaderElect: true
  leaderElectionID: kuberploy-external-secrets-controller
  leaderElectionLeaseDuration: ""
  leaderElectionRenewDeadline: ""
  leaderElectionRetryPeriod: ""
  controllerClass: kuberploy
  extendedMetricLabels: false
  scopedNamespace: ""
  scopedRBAC: false
  openshiftFinalizers: false
  systemAuthDelegator: false
  processClusterExternalSecret: false
  processClusterPushSecret: false
  processClusterStore: false
  processSecretStore: true
  storeRequeueInterval: 5m
  processClusterGenerator: false
  processPushSecret: false
  genericTargets:
    enabled: false
    resources: []
  createOperator: true
  enableHTTP2: false
  vault:
    enableTokenCache: false
    tokenCacheSize: 262144
  concurrent: 4
  log:
    level: info
    timeEncoding: epoch
  service:
    ipFamilyPolicy: ""
    ipFamilies: []
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    extraLabels: {}
    name: kuberploy-external-secrets
  rbac:
    create: true
    serviceAccountTokenCreate: false
    servicebindings:
      create: false
    aggregateToView: false
    aggregateToEdit: false
    aggregateToAdmin: false
  extraEnv: []
  extraArgs: {}
  extraVolumes: []
  extraObjects: []
  extraVolumeMounts: []
  extraInitContainers: []
  extraContainers: []
  deploymentAnnotations: {}
  strategy: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    enabled: true
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    enabled: true
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  serviceMonitor:
    enabled: false
    renderMode: skipIfMissing
    namespace: ""
    additionalLabels: {}
    interval: 30s
    scrapeTimeout: 25s
    honorLabels: false
    metricRelabelings: []
    relabelings: []
  metrics:
    listen:
      port: 8080
      auth: {enabled: false}
      secure: {enabled: false, certDir: /etc/tls, certFile: /etc/tls/tls.crt, keyFile: /etc/tls/tls.key}
    service: {enabled: true, port: 8080, annotations: {}}
  grafanaDashboard:
    enabled: false
  livenessProbe:
    enabled: true
    spec:
      address: ""
      port: 8082
      timeoutSeconds: 5
      failureThreshold: 5
      periodSeconds: 10
      successThreshold: 1
      initialDelaySeconds: 10
      httpGet: {port: live, path: /healthz}
  readinessProbe:
    enabled: true
    spec:
      timeoutSeconds: 5
      failureThreshold: 3
      periodSeconds: 10
      successThreshold: 1
      initialDelaySeconds: 10
      httpGet: {port: live, path: /readyz}
  nodeSelector: {kubernetes.io/os: linux}
  tolerations: []
  topologySpreadConstraints: []
  affinity: {}
  priorityClassName: ""
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    nameOverride: ""
  hostNetwork: false
  networkPolicy:
    enabled: false
    ingress: []
    egress: []
  webhook:
