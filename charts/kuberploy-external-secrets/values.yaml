    annotations: {}
    certCheckInterval: 5m
    lookaheadInterval: ""
    replicaCount: 2
    log: {level: info, timeEncoding: epoch}
    revisionHistoryLimit: 3
    certDir: /tmp/certs
    failurePolicy: Fail
    hostNetwork: false
    networkPolicy: {enabled: false, ingress: [], egress: []}
    image:
      repository: ghcr.io/external-secrets/external-secrets
      pullPolicy: IfNotPresent
      tag: v2.8.0
      flavour: ""
    imagePullSecrets: []
    port: 10250
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      extraLabels: {}
      name: kuberploy-external-secrets-webhook
    nodeSelector: {kubernetes.io/os: linux}
    hostAliases: []
    certManager:
      enabled: false
      addInjectorAnnotations: false
      cert: {create: false}
    tolerations: []
    topologySpreadConstraints: []
    affinity: {}
    strategy: {}
    priorityClassName: ""
    podDisruptionBudget: {enabled: true, minAvailable: 1, nameOverride: ""}
    metrics:
      listen:
        port: 8080
        auth: {enabled: false}
        secure: {enabled: false, certDir: /etc/tls, certFile: /etc/tls/tls.crt, keyFile: /etc/tls/tls.key}
      service: {enabled: true, port: 8080, annotations: {}}
    livenessProbe: {enabled: true, port: 8081, timeoutSeconds: 5, failureThreshold: 5, periodSeconds: 10, successThreshold: 1, initialDelaySeconds: 10}
    readinessProbe: {enabled: true, address: "", port: 8081, timeoutSeconds: 5, failureThreshold: 3, periodSeconds: 5, successThreshold: 1, initialDelaySeconds: 10}
    startupProbe: {enabled: false, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 30}
    extraEnv: []
    extraArgs: {}
    extraInitContainers: []
    extraVolumes: []
    extraVolumeMounts: []
    secretAnnotations: {}
    deploymentAnnotations: {}
    podAnnotations: {}
    podLabels: {}
    podSecurityContext: {enabled: true}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      enabled: true
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile: {type: RuntimeDefault}
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {cpu: 200m, memory: 256Mi}
    service: {enabled: true, annotations: {}, labels: {}, type: ClusterIP, loadBalancerIP: ""}
  certController:
    create: true
    requeueInterval: 5m
    replicaCount: 2
    log: {level: info, timeEncoding: epoch}
    revisionHistoryLimit: 3
    image:
      repository: ghcr.io/external-secrets/external-secrets
      pullPolicy: IfNotPresent
      tag: v2.8.0
      flavour: ""
    imagePullSecrets: []
    rbac: {create: true}
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      extraLabels: {}
      name: kuberploy-external-secrets-cert-controller
    nodeSelector: {kubernetes.io/os: linux}
    hostAliases: []
    tolerations: []
    topologySpreadConstraints: []
    affinity: {}
    strategy: {}
    hostNetwork: false
    networkPolicy: {enabled: false, ingress: [], egress: []}
    priorityClassName: ""
    podDisruptionBudget: {enabled: true, minAvailable: 1, nameOverride: ""}
    metrics:
      listen:
        port: 8080
        auth: {enabled: false}
        secure: {enabled: false, certDir: /etc/tls, certFile: /etc/tls/tls.crt, keyFile: /etc/tls/tls.key}
      service: {enabled: true, port: 8080, annotations: {}}
    livenessProbe: {enabled: true, port: 8081, timeoutSeconds: 5, failureThreshold: 5, periodSeconds: 10, successThreshold: 1, initialDelaySeconds: 10}
    readinessProbe: {enabled: true, address: "", port: 8081, timeoutSeconds: 5, failureThreshold: 3, periodSeconds: 5, successThreshold: 1, initialDelaySeconds: 10}
    startupProbe: {enabled: false, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 30}
    extraEnv: []
    extraArgs: {}
    extraInitContainers: []
    extraVolumes: []
    extraVolumeMounts: []
    deploymentAnnotations: {}
    podAnnotations: {}
    podLabels: {}
    podSecurityContext: {enabled: true}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      enabled: true
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile: {type: RuntimeDefault}
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {cpu: 200m, memory: 256Mi}
  dnsPolicy: ClusterFirst
  dnsConfig: {}
  hostAliases: []
  podSpecExtra: {}
