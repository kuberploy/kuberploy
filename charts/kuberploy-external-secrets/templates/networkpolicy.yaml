{{- if and .Values.secretFoundation.operator.managed .Values.secretFoundation.networkPolicy.enabled }}
{{- $configuredAPICIDRs := .Values.secretFoundation.networkPolicy.kubeAPIServerCIDRs }}
{{- $apiCIDRs := $configuredAPICIDRs }}
{{- if empty $apiCIDRs }}{{- $apiCIDRs = list "0.0.0.0/0" "::/0" }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberploy-external-secrets.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.secretFoundation.networkPolicy.monitoringNamespace }}
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        {{- range $apiCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
    - to:
        {{- $providerCIDRs := .Values.secretFoundation.networkPolicy.providerHTTPSCIDRs -}}
        {{- $defaultProviderEgress := empty $providerCIDRs -}}
        {{- if $defaultProviderEgress -}}{{- $providerCIDRs = list "0.0.0.0/0" "::/0" -}}{{- end -}}
        {{- range $providerCIDR := $providerCIDRs }}
        - ipBlock:
            cidr: {{ $providerCIDR | quote }}
            {{- if $defaultProviderEgress }}
            {{- $familyAPI := list -}}
            {{- range $apiCIDR := $configuredAPICIDRs -}}
              {{- if or (and (contains "." $providerCIDR) (contains "." $apiCIDR)) (and (contains ":" $providerCIDR) (contains ":" $apiCIDR)) -}}
                {{- $familyAPI = append $familyAPI $apiCIDR -}}
              {{- end -}}
            {{- end }}
            {{- if $familyAPI }}
            except:
              {{- toYaml $familyAPI | nindent 14 }}
            {{- end }}
            {{- end }}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberploy-external-secrets.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if $configuredAPICIDRs }}
    - from:
        {{- range $configuredAPICIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: 10250, protocol: TCP}
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.secretFoundation.networkPolicy.monitoringNamespace }}
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        {{- range $apiCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
---
