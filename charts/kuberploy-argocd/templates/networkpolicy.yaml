{{- if and .Values.argoFoundation.argoCD.managed .Values.argoFoundation.networkPolicy.enabled }}
{{- $configuredAPICIDRs := .Values.argoFoundation.networkPolicy.kubeAPIServerCIDRs }}
{{- $apiCIDRs := $configuredAPICIDRs }}
{{- if empty $apiCIDRs }}{{- $apiCIDRs = list "0.0.0.0/0" "::/0" }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  namespace: argocd
  labels:
    {{- include "kuberploy-argocd.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-required-connectivity
  namespace: argocd
  labels:
    {{- include "kuberploy-argocd.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.argoFoundation.networkPolicy.controlPlaneNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.argoFoundation.networkPolicy.edgeNamespace }}
      ports:
        - {port: 8080, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.argoFoundation.networkPolicy.monitoringNamespace }}
      ports:
        - {port: 8082, protocol: TCP}
        - {port: 8083, protocol: TCP}
        - {port: 8084, protocol: TCP}
        - {port: 8085, protocol: TCP}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        {{- range $apiCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.argoFoundation.networkPolicy.valkeyNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - {port: 6379, protocol: TCP}
    - to:
        {{- $repositoryCIDRs := .Values.argoFoundation.networkPolicy.repositoryEgressCIDRs -}}
        {{- $defaultRepositoryEgress := empty $repositoryCIDRs -}}
        {{- if $defaultRepositoryEgress -}}{{- $repositoryCIDRs = list "0.0.0.0/0" "::/0" -}}{{- end -}}
        {{- range $repositoryCIDR := $repositoryCIDRs }}
        - ipBlock:
            cidr: {{ $repositoryCIDR | quote }}
            {{- if $defaultRepositoryEgress }}
            {{- $exclusions := list -}}
            {{- range $apiCIDR := $configuredAPICIDRs -}}
              {{- if or (and (contains "." $repositoryCIDR) (contains "." $apiCIDR)) (and (contains ":" $repositoryCIDR) (contains ":" $apiCIDR)) -}}
                {{- $exclusions = append $exclusions $apiCIDR -}}
              {{- end -}}
            {{- end -}}
            {{- with $exclusions }}
            except:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-private-egress
  namespace: argocd
  labels:
    {{- include "kuberploy-argocd.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
{{- end }}
