{{- include "kuberploy-argocd.validate" . -}}
{{- $existingNamespace := lookup "v1" "Namespace" "" "argocd" -}}
{{- $existingAnnotations := dict -}}
{{- if not (empty $existingNamespace) -}}
  {{- $existingAnnotations = default dict $existingNamespace.metadata.annotations -}}
{{- end -}}
{{- $ownedByRelease := and
  (eq (get $existingAnnotations "meta.helm.sh/release-name") .Release.Name)
  (eq (get $existingAnnotations "meta.helm.sh/release-namespace") .Release.Namespace)
-}}
{{- if and .Values.argoFoundation.namespace.create .Values.argoFoundation.argoCD.managed (or (empty $existingNamespace) $ownedByRelease) }}
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    {{- include "kuberploy-argocd.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
