{{- if and .Values.monitoring.managed .Values.monitoring.networkPolicy.enabled }}
{{- $apiCIDRs := .Values.monitoring.networkPolicy.kubeAPIServerCIDRs }}
{{- if empty $apiCIDRs }}{{- $apiCIDRs = list "0.0.0.0/0" "::/0" }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy-monitoring.fullname" . }}-default-deny-ingress
  namespace: kuberploy-monitoring
  labels:
    {{- include "kuberploy-monitoring.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy-monitoring.fullname" . }}-prometheus-query
  namespace: kuberploy-monitoring
  labels:
    {{- include "kuberploy-monitoring.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.monitoring.networkPolicy.queryClient.namespaceLabel | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.monitoring.networkPolicy.queryClient.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy-monitoring.fullname" . }}-prometheus-scrapes
  namespace: kuberploy-monitoring
  labels:
    {{- include "kuberploy-monitoring.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8081}
        - {protocol: TCP, port: 9093}
        - {protocol: TCP, port: 9100}
        - {protocol: TCP, port: 10250}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy-monitoring.fullname" . }}-private-egress
  namespace: kuberploy-monitoring
  labels:
    {{- include "kuberploy-monitoring.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
    - to:
        {{- range uniq (sortAlpha $apiCIDRs) }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
{{- end }}
