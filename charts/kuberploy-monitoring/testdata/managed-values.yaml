monitoring:
  networkPolicy:
    enabled: true
    kubeAPIServerCIDRs: [10.43.0.1/32]

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 14d
      retentionSize: 18GB
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: null
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 20Gi
