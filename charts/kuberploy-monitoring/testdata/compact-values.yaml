kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 7d
      retentionSize: 8GB
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi
