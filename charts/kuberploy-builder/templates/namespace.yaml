{{- include "kuberploy-builder.validate" . -}}
{{- if and .Values.enabled .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    {{- include "kuberploy-builder.labels" . | nindent 4 }}
    kuberploy.io/builder-namespace: dind
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
