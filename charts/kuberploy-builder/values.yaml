enabled: false

# Required as a nonempty operator-selected compatible image reference before enabled=true.
builderAgentImage: ""
buildKitImage: docker.io/moby/buildkit:v0.32.2
# Restartable privileged sidecar image. Version tags keep local mirrors
# functional; sha256 references are accepted for immutable deployments.
dindImage: docker.io/library/docker:29.7.1-dind

# Revision-zero install default only. Privileged DinD runs on any schedulable
# node so a one-node install can build immediately. After bootstrap, Settings →
# Source builders is authoritative for new build attempts.
nodeIsolation:
  enabled: false

# Optional operator-managed credential profiles inherited by the control-plane
# chart. Profile scope is explicit even though this standalone chart does not
# mount the Secrets itself.
buildSecret:
  name: ""
  profiles: []
sshSecret:
  name: ""
  profiles: []

namespace:
  create: true
  name: kuberploy-build-dind

controllerServiceAccount:
  namespace: kuberploy-system
  name: kuberploy-controller

podServiceAccount:
  name: kuberploy-build-pod

admissionPolicy:
  # Required whenever the privileged builder is enabled. Kubernetes 1.34+
  # provides ValidatingAdmissionPolicy; keeping this boundary on by default
  # prevents a compromised controller token from submitting an arbitrary
  # privileged Job.
  enabled: true

networkPolicy:
  enabled: false
  kubeAPIServerCIDRs: []
  sourceEgressCIDRs: []
  registryEgressCIDRs: []

resourceQuota:
  hard:
    pods: "20"
    requestsCpu: "20"
    requestsMemory: 40Gi
    requestsEphemeralStorage: 100Gi
    limitsCpu: "40"
    limitsMemory: 80Gi
    limitsEphemeralStorage: 200Gi
