enabled: false

# Required as an explicit text-version image reference before enabled=true.
builderAgentImage: ""
buildKitImage: docker.io/moby/buildkit:v0.32.2

namespace:
  create: true
  name: kuberploy-build-dind

controllerServiceAccount:
  namespace: kuberploy-system
  name: kuberploy-controller

podServiceAccount:
  name: kuberploy-build-pod

admissionPolicy:
  enabled: true

networkPolicy:
  enabled: true
  allowSharedNodeEndpoint: false

resourceQuota:
  hard:
    pods: "20"
    requestsCpu: "20"
    requestsMemory: 40Gi
    requestsEphemeralStorage: 100Gi
    limitsCpu: "40"
    limitsMemory: 80Gi
    limitsEphemeralStorage: 200Gi
