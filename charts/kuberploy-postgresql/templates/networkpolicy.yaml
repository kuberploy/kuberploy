{{- if .Values.postgresqlFoundation.managed }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kuberploy-postgresql-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberploy-postgresql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kuberploy-postgresql.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kuberploy-postgresql-client-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberploy-postgresql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kuberploy-postgresql.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.postgresqlFoundation.networkPolicy.controlPlaneNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kuberploy
      ports:
        - {port: 5432, protocol: TCP}
{{- end }}
