{{- if and .Values.enabled (ne .Values.exposure.mode "internal") }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "kuberploy-registry.fullname" . }}
  labels:
    {{- include "kuberploy-registry.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.exposure.secretName }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.exposure.clusterIssuerName }}
  {{- if regexMatch "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$" .Values.exposure.endpoint }}
  ipAddresses:
    - {{ .Values.exposure.endpoint | quote }}
  {{- else }}
  dnsNames:
    - {{ .Values.exposure.endpoint | quote }}
  {{- end }}
{{- end }}
