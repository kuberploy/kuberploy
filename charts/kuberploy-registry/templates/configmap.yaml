{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kuberploy-registry.configName" . }}
  labels:
    {{- include "kuberploy-registry.labels" . | nindent 4 }}
  {{- if eq .Values.auth.mode "testOnlyUnauthenticated" }}
  annotations:
    kuberploy.io/security-warning: test-only-unauthenticated
  {{- end }}
immutable: true
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      formatter: json
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
      cache:
        blobdescriptor: inmemory
      maintenance:
        uploadpurging:
          enabled: true
          age: 168h
          interval: 24h
          dryrun: false
    http:
      addr: :{{ .Values.service.port }}
      draintimeout: 60s
      {{- if ne .Values.exposure.mode "internal" }}
      tls:
        certificate: /tls/tls.crt
        key: /tls/tls.key
      {{- end }}
      headers:
        X-Content-Type-Options: [nosniff]
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
    {{- if eq .Values.auth.mode "htpasswd" }}
    auth:
      htpasswd:
        realm: {{ .Values.auth.realm | quote }}
        path: /auth/htpasswd
    {{- end }}
{{- end }}
