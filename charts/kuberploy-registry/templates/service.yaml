{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kuberploy-registry.fullname" . }}
  labels:
    {{- include "kuberploy-registry.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector:
    {{- include "kuberploy-registry.selectorLabels" . | nindent 4 }}
  ports:
    - name: registry
      port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: registry
{{- end }}
