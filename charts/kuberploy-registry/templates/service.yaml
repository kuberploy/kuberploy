{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kuberploy-registry.fullname" . }}
  labels:
    {{- include "kuberploy-registry.labels" . | nindent 4 }}
  {{- if ne .Values.exposure.mode "internal" }}
  annotations:
    # Traefik service annotations, not Ingress annotations: this transport
    # verifies the registry's public certificate with its public DNS name.
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: {{ printf "%s-%s-backend@kubernetescrd" .Release.Namespace (include "kuberploy-registry.fullname" .) | quote }}
  {{- end }}
spec:
  type: ClusterIP
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector:
    {{- include "kuberploy-registry.selectorLabels" . | nindent 4 }}
  ports:
    - name: registry
      port: {{ if eq .Values.exposure.mode "internal" }}{{ .Values.service.port }}{{ else }}443{{ end }}
      protocol: TCP
      targetPort: registry
{{- end }}
