{{- if and .Values.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy-registry.fullname" . }}
  labels:
    {{- include "kuberploy-registry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kuberploy-registry.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range uniq (sortAlpha .Values.networkPolicy.allowedNamespaces) }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy-registry.fullname" . }}-private-egress
  labels:
    {{- include "kuberploy-registry.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
{{- end }}
