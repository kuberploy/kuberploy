apiVersion: v2
name: kuberploy-installer
description: Bootstrap Argo CD and independently owned Kuberploy component releases
type: application
version: 0.1.0-rc.1
appVersion: "0.1.0-rc.1"
kubeVersion: ">=1.34.0-0 <1.37.0-0"
annotations:
  kuberploy.io/ownership-boundary: bootstrap-applications-only
  kuberploy.io/argocd-wrapper-sha256: e7031da07638cb4a1bae66646d5ba9cfc327801a400f9c2d2050d9e5fcecec90
dependencies:
  - name: kuberploy-valkey
    alias: bootstrapvalkey
    version: 0.1.0-rc.1
    repository: file://../kuberploy-valkey
    condition: bootstrap.valkey.enabled
  - name: kuberploy-argocd
    alias: argoCD
    version: 0.1.0-rc.1
    repository: file://../kuberploy-argocd
    condition: bootstrap.argoCD.enabled
