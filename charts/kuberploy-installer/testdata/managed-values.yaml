bootstrap:
  valkey:
    enabled: true
  argoCD:
    enabled: true
    mode: managed
    managedPrerequisitesConfirmed: true

source:
  chartRepository: ghcr.io/kuberploy/charts
  valuesRepository: https://github.com/kuberploy/kuberploy.git
  valuesRevision: "v0.1.0-rc.129"

components:
  postgresql:
    enabled: true
    mode: managed
    adoptionConfirmed: false
    expectedPackageVersion: 0.1.0-rc.129
    valueFiles:
      - examples/installer/postgresql.yaml

argoCD:
  argoFoundation:
    networkPolicy:
      kubeAPIServerCIDRs:
        - 10.43.0.1/32
      repositoryEgressCIDRs:
        - 203.0.113.10/32
