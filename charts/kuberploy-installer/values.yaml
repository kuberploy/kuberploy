bootstrap:
  valkey:
    enabled: false
  argoCD:
    enabled: false
    mode: disabled
    # Managed Argo uses the separately owned Valkey service. This attests that
    # the service and exact Argo credential Secret exist before Helm starts.
    managedPrerequisitesConfirmed: false
  controlPlaneToken:
    # generated creates the one-time token in-cluster; precreated uses an
    # operator-owned kuberploy-bootstrap Secret. Disabled is valid only while
    # the control-plane Application is disabled.
    mode: disabled
    kubeAPIServerCIDRs: []

source:
  # Child charts are read from one explicit semantic release tag. The tag is
  # the human-readable version selector; provenance and integrity are verified
  # separately and are never presented as versions.
  repoURL: ""
  targetRevision: ""
  chartRoot: charts

applications:
  automated: true
  prune: true
  selfHeal: true

# Cluster facts are supplied explicitly in the installer Helm values and are
# injected only into selected child charts that need direct Kubernetes API
# access. They are not credentials and cannot be broad all-address ranges.
cluster:
  kubeAPIServerCIDRs: []

# Optional public control-plane endpoint. Enabling it also requires the
# control-plane and edge components. TLS refers only to a pre-existing Secret;
# cert-manager may populate that Secret independently.
publicEndpoint:
  enabled: false
  hostname: ""
  tls:
    enabled: false
    secretName: ""
    clusterIssuerName: ""
    accountEmail: ""

components:
  controlPlane: &disabledComponent
    enabled: false
    mode: disabled
    adoptionConfirmed: false
    expectedPackageVersion: ""
    valueFiles: []
  postgresql: *disabledComponent
  valkey: *disabledComponent
  edge: *disabledComponent
  certManager: *disabledComponent
  externalDNS: *disabledComponent
  externalSecrets: *disabledComponent
  sealedSecrets: *disabledComponent
  monitoring: *disabledComponent
  builder: *disabledComponent
  registry: *disabledComponent

# Values for the direct, same-namespace Argo CD bootstrap dependency. The
# installer never rewrites these. They must satisfy kuberploy-argocd's own
# managed/adopted validation and remain independently explicit.
argoCD:
  argoFoundation:
    namespace:
      create: true
    argoCD:
      managed: true
      adoptExisting: false
      capabilitiesConfirmed: false
    prerequisites:
      argoSecretName: argocd-secret
      valkeySecretName: kuberploy-argocd-valkey-auth
    networkPolicy:
      enabled: true
      kubeAPIServerCIDRs: []
      repositoryEgressCIDRs: []
      valkeyNamespace: kuberploy-system
      controlPlaneNamespace: kuberploy-system
      edgeNamespace: kuberploy-system
      monitoringNamespace: kuberploy-monitoring
    bootstrap:
      enabled: false
      clusterID: ""
      bindingID: ""
      repositoryOwner: ""
      repositoryName: ""
      targetRevision: ""

# Direct blank-cluster bootstrap dependency. It remains owned by the installer
# release in kuberploy-system so Argo CD never depends on a child Application
# before its own controller can start.
bootstrapvalkey:
  valkeyFoundation:
    managed: true
    adoptExisting: false
    namespace:
      create: false
    networkPolicy:
      enabled: true
      controlPlaneNamespace: kuberploy-system
      argoCDNamespace: argocd
