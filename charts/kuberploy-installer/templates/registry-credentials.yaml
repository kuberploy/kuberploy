{{- $registry := .Values.integrations.registry -}}
{{- if and $registry.enabled $registry.generateCredentials -}}
{{- $stateName := "kuberploy-managed-registry-credentials" -}}
{{- $existing := lookup "v1" "Secret" "kuberploy-system" $stateName -}}
{{- $lifecycleUsername := "kuberploy-lifecycle" | b64enc -}}
{{- $lifecyclePassword := randAlphaNum 64 | b64enc -}}
{{- $pushUsername := "kuberploy-builder-push" | b64enc -}}
{{- $pushPassword := randAlphaNum 64 | b64enc -}}
{{- $cacheUsername := "kuberploy-builder-cache" | b64enc -}}
{{- $cachePassword := randAlphaNum 64 | b64enc -}}
{{- $helmUsername := "kuberploy-helm" | b64enc -}}
{{- $helmPassword := randAlphaNum 64 | b64enc -}}
{{- $pullUsername := "kuberploy-runtime-pull" | b64enc -}}
{{- $pullPassword := randAlphaNum 64 | b64enc -}}
{{- $httpSecret := randAlphaNum 64 | b64enc -}}
{{- $htpasswd := printf "%s\n%s\n%s\n%s\n%s"
      (htpasswd ($lifecycleUsername | b64dec) ($lifecyclePassword | b64dec))
      (htpasswd ($pushUsername | b64dec) ($pushPassword | b64dec))
      (htpasswd ($cacheUsername | b64dec) ($cachePassword | b64dec))
      (htpasswd ($helmUsername | b64dec) ($helmPassword | b64dec))
      (htpasswd ($pullUsername | b64dec) ($pullPassword | b64dec)) | b64enc -}}
{{- if $existing -}}
  {{- $lifecycleUsername = index $existing.data "lifecycle-username" -}}
  {{- $lifecyclePassword = index $existing.data "lifecycle-password" -}}
  {{- $pushUsername = index $existing.data "push-username" -}}
  {{- $pushPassword = index $existing.data "push-password" -}}
  {{- $cacheUsername = index $existing.data "cache-username" -}}
  {{- $cachePassword = index $existing.data "cache-password" -}}
  {{- $helmUsername = index $existing.data "helm-username" -}}
  {{- $helmPassword = index $existing.data "helm-password" -}}
  {{- $pullUsername = index $existing.data "pull-username" -}}
  {{- $pullPassword = index $existing.data "pull-password" -}}
  {{- $httpSecret = index $existing.data "http-secret" -}}
  {{- $htpasswd = index $existing.data "htpasswd" -}}
{{- end -}}
{{- $pullAuth := printf "%s:%s" ($pullUsername | b64dec) ($pullPassword | b64dec) | b64enc -}}
{{- $pullDockerConfig := dict "auths" (dict $registry.endpoint (dict
      "username" ($pullUsername | b64dec)
      "password" ($pullPassword | b64dec)
      "auth" $pullAuth)) | toJson | b64enc -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $stateName }}
  namespace: kuberploy-system
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
    app.kubernetes.io/component: managed-registry-credentials
type: Opaque
data:
  lifecycle-username: {{ $lifecycleUsername | quote }}
  lifecycle-password: {{ $lifecyclePassword | quote }}
  push-username: {{ $pushUsername | quote }}
  push-password: {{ $pushPassword | quote }}
  cache-username: {{ $cacheUsername | quote }}
  cache-password: {{ $cachePassword | quote }}
  helm-username: {{ $helmUsername | quote }}
  helm-password: {{ $helmPassword | quote }}
  pull-username: {{ $pullUsername | quote }}
  pull-password: {{ $pullPassword | quote }}
  http-secret: {{ $httpSecret | quote }}
  htpasswd: {{ $htpasswd | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $registry.authSecretName }}
  namespace: kuberploy-system
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
    app.kubernetes.io/component: managed-registry-auth
type: Opaque
data:
  htpasswd: {{ $htpasswd | quote }}
  httpSecret: {{ $httpSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $registry.lifecycleCredentialSecretName }}
  namespace: kuberploy-system
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
    app.kubernetes.io/component: managed-registry-lifecycle
type: Opaque
data:
  username: {{ $lifecycleUsername | quote }}
  password: {{ $lifecyclePassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $registry.helmCredentialSecretName }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: helm
  enableOCI: "true"
  url: {{ printf "%s/%s" $registry.endpoint $registry.repositoryPrefix | quote }}
  username: {{ $helmUsername | b64dec | quote }}
  password: {{ $helmPassword | b64dec | quote }}
{{- if .Values.components.builder.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $registry.pushCredentialRef }}
  namespace: kuberploy-build-dind
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
    app.kubernetes.io/component: managed-registry-builder-push
type: Opaque
data:
  username: {{ $pushUsername | quote }}
  password: {{ $pushPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $registry.cacheCredentialRef }}
  namespace: kuberploy-build-dind
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
    app.kubernetes.io/component: managed-registry-builder-cache
type: Opaque
data:
  username: {{ $cacheUsername | quote }}
  password: {{ $cachePassword | quote }}
{{- end }}
{{- if $registry.runtimePull.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $registry.runtimePull.sourceSecretName }}
  namespace: kuberploy-system
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
    app.kubernetes.io/component: managed-registry-runtime-pull
type: kubernetes.io/dockerconfigjson
data:
  {{ $registry.runtimePull.sourceSecretKey }}: {{ $pullDockerConfig | quote }}
{{- end }}
{{- end }}
