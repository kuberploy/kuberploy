{{- define "kuberploy-installer.applicationDocuments" -}}
{{- include "kuberploy-installer.validate" . -}}
{{- $root := . -}}
{{- $networkPolicyEnabled := $root.Values.cluster.networkPolicyEnabled -}}
{{- $catalog := include "kuberploy-installer.applicationCatalog" . | fromYamlArray -}}
{{- range $item := $catalog -}}
{{- $component := get $root.Values.components $item.key -}}
{{- $builderEmbeddedInControlPlane := and (eq $item.key "builder") $root.Values.integrations.github.enabled -}}
{{- if $component.enabled -}}
{{- if $root.Capabilities.APIVersions.Has "argoproj.io/v1alpha1/Application" -}}
{{- $existing := lookup "argoproj.io/v1alpha1" "Application" "argocd" $item.application -}}
{{- if $existing -}}
  {{- $existingMode := dig "metadata" "annotations" "kuberploy.io/installation-mode" "" $existing -}}
  {{- if and (ne $existingMode "") (ne $existingMode $component.mode) -}}
    {{- fail (printf "%s installation mode is immutable; decommission or migrate the existing Application explicitly" $item.application) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $childValues := include "kuberploy-installer.modeFence" (list $item.key $component.mode) | fromYaml -}}
{{- if $builderEmbeddedInControlPlane -}}
  {{- $childValues = mergeOverwrite $childValues (dict "enabled" false) -}}
{{- end -}}
{{- if and (eq $item.key "controlPlane") $root.Values.components.valkey.enabled (eq $root.Values.components.valkey.mode "managed") -}}
  {{- $managedValkey := dict "config" (dict "valkey" (dict
    "mode" "managed"
    "secretRef" (dict
      "name" "kuberploy-valkey"
      "addressesKey" "addresses"
      "usernameKey" "username"
      "passwordKey" "password"
      "apiCacheUsernameKey" "api-cache-username"
      "apiCachePasswordKey" "api-cache-password"
      "apiLimiterUsernameKey" "api-limiter-username"
      "apiLimiterPasswordKey" "api-limiter-password"
      "publisherUsernameKey" "outbox-publisher-username"
      "publisherPasswordKey" "outbox-publisher-password"
      "consumerUsernameKey" "worker-consumer-username"
      "consumerPasswordKey" "worker-consumer-password"
    ))) -}}
  {{- $childValues = mergeOverwrite $childValues $managedValkey -}}
{{- end -}}
{{- if eq $item.key "controlPlane" -}}
  {{- $token := $root.Values.bootstrap.controlPlaneToken -}}
  {{- $apiCIDRs := $root.Values.cluster.kubeAPIServerCIDRs -}}
  {{- if eq $token.mode "generated" -}}
    {{- $apiCIDRs = $token.kubeAPIServerCIDRs -}}
  {{- end -}}
  {{- $bootstrapValues := dict
    "config" (dict
      "bootstrapSecret" (dict "generate" (eq $token.mode "generated"))
      "gitSSH" (dict "enabled" true "encryptionKeyVersion" "v1" "secretRef" (dict "name" "kuberploy-git-ssh" "key" "encryption-key"))
    )
    "networkPolicy" (dict "enabled" $networkPolicyEnabled "kubeAPIServerCIDRs" $apiCIDRs)
  -}}
  {{- $childValues = mergeOverwrite $childValues $bootstrapValues -}}
{{- end -}}
{{- if and (eq $item.key "controlPlane") $root.Values.publicEndpoint.enabled -}}
  {{- $public := $root.Values.publicEndpoint -}}
  {{- $scheme := ternary "https" "http" $public.tls.enabled -}}
  {{- $endpointValues := dict
    "config" (dict "publicURL" (printf "%s://%s" $scheme $public.hostname))
    "ingress" (dict
      "enabled" true
      "className" "traefik"
      "host" $public.hostname
      "tls" (dict "enabled" $public.tls.enabled "redirectHttp" $public.tls.enabled "secretName" $public.tls.secretName "issuerName" (ternary $public.tls.clusterIssuerName "" $public.tls.manageCertificate))
    )
  -}}
  {{- $childValues = mergeOverwrite $childValues $endpointValues -}}
{{- end -}}
{{- if eq $item.key "edge" -}}
  {{- $childValues = mergeOverwrite $childValues (dict "edge" (dict "networkPolicy" (dict "enabled" $networkPolicyEnabled "kubeAPIServerCIDRs" $root.Values.cluster.kubeAPIServerCIDRs))) -}}
  {{- $edgeDeploymentSpecDigest := ternary "sha256:7ab84c94484d74b965283aa082fd7b21de5b5ed3ffe8cbc3e36d8335624e42bf" "sha256:c9d587fd919c76a5d78991b0f23a3b5e3562003e532287b07d3194292e27753b" $root.Values.components.monitoring.enabled -}}
  {{- $childValues = mergeOverwrite $childValues (dict "traefik" (dict "deployment" (dict "annotations" (dict "kuberploy.io/edge-spec-digest" $edgeDeploymentSpecDigest)))) -}}
  {{- $childValues = mergeOverwrite $childValues (dict "traefik" (dict "metrics" (dict "prometheus" (dict "serviceMonitor" (dict "enabled" $root.Values.components.monitoring.enabled))))) -}}
{{- else if eq $item.key "certManager" -}}
  {{- $childValues = mergeOverwrite $childValues (dict "foundation" (dict "networkPolicy" (dict "enabled" $networkPolicyEnabled "kubeAPIServerCIDRs" $root.Values.cluster.kubeAPIServerCIDRs))) -}}
  {{- if and $root.Values.publicEndpoint.tls.enabled $root.Values.publicEndpoint.tls.manageCertificate -}}
    {{- $issuer := dict
      "enabled" true
      "name" $root.Values.publicEndpoint.tls.clusterIssuerName
      "email" $root.Values.publicEndpoint.tls.accountEmail
      "server" "https://acme-v02.api.letsencrypt.org/directory"
      "privateKeySecretName" (printf "%s-account" $root.Values.publicEndpoint.tls.clusterIssuerName)
      "dns01Profiles" (list)
    -}}
    {{- $childValues = mergeOverwrite $childValues (dict "foundation" (dict "issuers" (dict "production" $issuer))) -}}
  {{- end -}}
{{- else if eq $item.key "externalDNS" -}}
  {{- $childValues = mergeOverwrite $childValues (dict "foundation" (dict "networkPolicy" (dict "enabled" $networkPolicyEnabled "kubeAPIServerCIDRs" $root.Values.cluster.kubeAPIServerCIDRs))) -}}
{{- else if eq $item.key "externalSecrets" -}}
  {{- $childValues = mergeOverwrite $childValues (dict "secretFoundation" (dict "networkPolicy" (dict "enabled" $networkPolicyEnabled "kubeAPIServerCIDRs" $root.Values.cluster.kubeAPIServerCIDRs))) -}}
{{- else if eq $item.key "sealedSecrets" -}}
  {{- $childValues = mergeOverwrite $childValues (dict "secretFoundation" (dict "networkPolicy" (dict "enabled" $networkPolicyEnabled "kubeAPIServerCIDRs" $root.Values.cluster.kubeAPIServerCIDRs))) -}}
{{- else if eq $item.key "monitoring" -}}
  {{- $childValues = mergeOverwrite $childValues (dict "monitoring" (dict "networkPolicy" (dict "enabled" $networkPolicyEnabled "kubeAPIServerCIDRs" $root.Values.cluster.kubeAPIServerCIDRs))) -}}
{{- end -}}
{{- if and (eq $item.key "controlPlane") $root.Values.components.monitoring.enabled -}}
  {{- $monitoringValues := dict
    "config" (dict "monitoring" (dict "mode" "managed" "prometheusURL" "http://prometheus-operated.kuberploy-monitoring.svc:9090" "bearerTokenSecret" (dict "name" "" "key" "token")))
    "networkPolicy" (dict "enabled" $networkPolicyEnabled "kubeAPIServerCIDRs" $root.Values.cluster.kubeAPIServerCIDRs)
  -}}
  {{- $childValues = mergeOverwrite $childValues $monitoringValues -}}
{{- end -}}
{{- if and (eq $item.key "controlPlane") $root.Values.integrations.github.enabled -}}
  {{- $github := $root.Values.integrations.github -}}
  {{- $runtimeChartVersion := index $root.Chart.Annotations "kuberploy.io/runtime-chart-version" -}}
  {{- $runtimeChartDigest := index $root.Chart.Annotations "kuberploy.io/runtime-chart-digest" -}}
  {{- $githubValues := dict
    "config" (dict
      "githubApp" (dict "enabled" true "appID" $github.appID "clientID" $github.clientID "appSlug" $github.appSlug "secretRef" (dict "name" $github.secretName))
      "buildLogs" (dict "enabled" true)
      "gitProjection" (dict "enabled" true "chartVersion" $component.expectedPackageVersion)
      "platformGitBinding" (dict "enabled" true "bindingID" $github.platformBindingID)
      "argoObservation" (dict "enabled" true "namespace" $github.argoNamespace "pollIntervalSeconds" 30)
      "environmentFoundation" (dict "enabled" true "platformBindingID" $github.platformBindingID "psaVersion" $github.psaVersion "pollIntervalSeconds" 1)
      "argoDesiredState" (dict "enabled" true "platformBindingID" $github.platformBindingID "namespace" $github.argoNamespace "runtimeChartRepository" "oci://ghcr.io/kuberploy/charts" "runtimeChartVersion" $runtimeChartVersion "runtimeChartDigest" $runtimeChartDigest "pollIntervalSeconds" 1 "catalogMaxAgeSeconds" 900)
      "autoDeploy" (dict "enabled" true)
    )
    "builder" (dict "enabled" true "buildKitImage" $github.buildKitImage "dindImage" $github.dindImage
      "buildSecret" (dict "name" $github.buildSecretName "profiles" $github.buildSecretProfiles)
      "sshSecret" (dict "name" $github.sshSecretName "profiles" $github.sshSecretProfiles)
      "networkPolicy" (dict "enabled" $networkPolicyEnabled "kubeAPIServerCIDRs" $root.Values.cluster.kubeAPIServerCIDRs "sourceEgressCIDRs" $github.sourceEgressCIDRs "registryEgressCIDRs" $github.registryEgressCIDRs))
    "networkPolicy" (dict "enabled" $networkPolicyEnabled "kubeAPIServerCIDRs" $root.Values.cluster.kubeAPIServerCIDRs "externalEgressCIDRs" $github.controlPlaneEgressCIDRs)
    "rbac" (dict "argoNamespace" $github.argoNamespace)
  -}}
  {{- $childValues = mergeOverwrite $childValues $githubValues -}}
{{- end -}}
{{- if and (eq $item.key "controlPlane") $root.Values.integrations.registry.enabled -}}
  {{- $registry := $root.Values.integrations.registry -}}
  {{- $registryConfigIdentity := dict "authMode" "htpasswd" "authRealm" "kuberploy-registry" "port" 5000 "tls" (ne $registry.exposureMode "internal") "endpoint" $registry.endpoint "tlsSecretName" $registry.tlsSecretName -}}
  {{- $registryConfigMap := printf "registry-config-%s" (toJson $registryConfigIdentity | sha256sum | trunc 12) -}}
  {{- $externalEgress := $registry.controlPlaneEgressCIDRs -}}
  {{- if $root.Values.integrations.github.enabled -}}
    {{- $externalEgress = concat $root.Values.integrations.github.controlPlaneEgressCIDRs $externalEgress | uniq | sortAlpha -}}
  {{- end -}}
  {{- $managedRegistryConfig := dict "managedRegistry" (dict
      "enabled" true
      "targetID" $registry.targetID
      "targetName" $registry.targetName
      "endpoint" (printf "https://%s" $registry.endpoint)
      "repositoryPrefix" $registry.repositoryPrefix
      "pullCredentialRef" $registry.pullCredentialRef
      "pushCredentialRef" $registry.pushCredentialRef
      "cacheCredentialRef" $registry.cacheCredentialRef
      "lifecycleCredentialRef" $registry.lifecycleCredentialRef
      "allowPlainHTTP" false
      "namespace" "kuberploy-system"
      "deployment" "registry"
      "persistentVolumeClaim" "registry"
      "registryConfigMap" $registryConfigMap
      "credentialSecret" (dict "name" $registry.lifecycleCredentialSecretName "usernameKey" "username" "passwordKey" "password")
      "observationIntervalSeconds" 300
    ) -}}
  {{- $managedRegistryValues := dict
    "config" $managedRegistryConfig
    "networkPolicy" (dict "enabled" $networkPolicyEnabled "kubeAPIServerCIDRs" $root.Values.cluster.kubeAPIServerCIDRs "externalEgressCIDRs" $externalEgress)
  -}}
  {{- $childValues = mergeOverwrite $childValues $managedRegistryValues -}}
{{- end -}}
{{- if and (eq $item.key "controlPlane") $root.Values.integrations.registry.runtimePull.enabled -}}
  {{- $pull := $root.Values.integrations.registry.runtimePull -}}
  {{- $pullValues := dict "config" (dict "runtimeRegistryPulls" (dict
    "enabled" true
    "namespaces" $pull.namespaces
    "namespacePrefixes" $pull.namespacePrefixes
    "profiles" (list (dict
      "name" $pull.profileName
      "targetId" $pull.targetID
      "registryServer" $root.Values.integrations.registry.endpoint
      "credentialRef" $pull.credentialRef
      "revision" $pull.revision
      "sourceSecretRef" $pull.sourceSecretName
      "sourceSecretKey" $pull.sourceSecretKey
    ))
    "pollIntervalSeconds" 30
    "workLeaseSeconds" 120
    "heartbeatSeconds" 20
    "readinessSeconds" 90
    "minimumBackoffSeconds" 5
    "maximumBackoffSeconds" 300
  )) -}}
  {{- $childValues = mergeOverwrite $childValues $pullValues -}}
{{- end -}}
{{- if and (eq $item.key "controlPlane") $root.Values.integrations.runtimeSecrets.enabled -}}
  {{- $runtimeSecrets := $root.Values.integrations.runtimeSecrets -}}
  {{- $runtimeSecretValues := dict "config" (dict
    "runtimeSecrets" (dict
      "enabled" true
      "namespaces" $runtimeSecrets.namespaces
      "namespacePrefixes" $runtimeSecrets.namespacePrefixes
      "fingerprintKeyID" $runtimeSecrets.fingerprintKeyID
      "fingerprintSecret" (dict "name" $runtimeSecrets.fingerprintSecretName "key" $runtimeSecrets.fingerprintSecretKey)
      "sealingCertificateSecret" (dict "name" $runtimeSecrets.sealingCertificateSecretName "key" $runtimeSecrets.sealingCertificateSecretKey)
      "pollIntervalSeconds" 5
      "workLeaseSeconds" 45
      "heartbeatSeconds" 10
      "idleSeconds" 1
      "minimumBackoffSeconds" 2
      "maximumBackoffSeconds" 300)
    "certificateObservation" (dict
      "enabled" true
      "pollIntervalSeconds" 30
      "workLeaseSeconds" 45
      "heartbeatSeconds" 10
      "idleSeconds" 1
      "minimumBackoffSeconds" 2
      "maximumBackoffSeconds" 300
      "maximumAgeSeconds" 90)
  ) -}}
  {{- $childValues = mergeOverwrite $childValues $runtimeSecretValues -}}
{{- end -}}
{{- if and (eq $item.key "builder") $root.Values.integrations.github.enabled -}}
  {{- $childValues = mergeOverwrite $childValues (dict "buildKitImage" $root.Values.integrations.github.buildKitImage "dindImage" $root.Values.integrations.github.dindImage) -}}
{{- end -}}
{{- if and (eq $item.key "registry") $root.Values.integrations.registry.enabled -}}
  {{- $registry := $root.Values.integrations.registry -}}
  {{- $registryValues := dict
    "auth" (dict "mode" "htpasswd" "existingSecret" $registry.authSecretName "secretRevision" $registry.secretRevision)
    "exposure" (dict "mode" $registry.exposureMode "manageCertificate" $registry.manageCertificate "cloudflareProxied" $registry.cloudflareProxied "endpoint" $registry.endpoint "ingressClassName" "traefik" "secretName" $registry.tlsSecretName "clusterIssuerName" $registry.clusterIssuerName "loadBalancer" $registry.loadBalancer)
    "networkPolicy" (dict "enabled" true "allowedNamespaces" (list "kuberploy-build-dind" "kuberploy-system"))
  -}}
  {{- $childValues = mergeOverwrite $childValues $registryValues -}}
{{- end -}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $item.application }}
  namespace: argocd
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "kuberploy-installer.labels" $root | nindent 4 }}
spec:
  sourceRepos:
    - {{ $root.Values.source.chartRepository | quote }}
    - {{ $root.Values.source.valuesRepository | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ $item.namespace }}
    {{- if eq $item.key "certManager" }}
    # cert-manager's upstream leader-election Roles live in kube-system.
    - server: https://kubernetes.default.svc
      namespace: kube-system
    {{- end }}
    {{- if and (eq $item.key "edge") $root.Values.components.monitoring.enabled }}
    # The managed edge release owns one exact protected Traefik ServiceMonitor
    # in the monitoring namespace. Monitoring installs its CRDs in an earlier
    # sync wave, and the edge Project has no other cross-namespace destination.
    - server: https://kubernetes.default.svc
      namespace: kuberploy-monitoring
    {{- end }}
    {{- if and (eq $item.key "controlPlane") $root.Values.components.monitoring.enabled }}
    # Managed monitoring attestation uses exact read-only Roles in its fixed
    # namespace; the control-plane Project must permit those named objects.
    - server: https://kubernetes.default.svc
      namespace: kuberploy-monitoring
    {{- end }}
    {{- if and (eq $item.key "controlPlane") $root.Values.components.certManager.enabled }}
    # Certificate-issuer readiness uses exact read-only Roles and RoleBindings
    # in cert-manager; the control-plane Project must permit those named objects.
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    {{- end }}
    {{- if and (eq $item.key "controlPlane") $root.Values.integrations.github.enabled }}
    # The control-plane chart owns only the worker's namespaced build-control
    # Role/Binding; builder Pods remain owned by the builder Application.
    - server: https://kubernetes.default.svc
      namespace: kuberploy-build-dind
    - server: https://kubernetes.default.svc
      namespace: {{ $root.Values.integrations.github.argoNamespace }}
    {{- end }}
    {{- if and (eq $item.key "controlPlane") $root.Values.integrations.registry.runtimePull.enabled }}
    {{- range uniq (sortAlpha $root.Values.integrations.registry.runtimePull.namespaces) }}
    - server: https://kubernetes.default.svc
      namespace: {{ . }}
    {{- end }}
    {{- end }}
    {{- if and (eq $item.key "controlPlane") $root.Values.integrations.runtimeSecrets.enabled }}
    {{- range uniq (sortAlpha $root.Values.integrations.runtimeSecrets.namespaces) }}
    - server: https://kubernetes.default.svc
      namespace: {{ . }}
    {{- end }}
    {{- range uniq (sortAlpha $root.Values.integrations.runtimeSecrets.namespacePrefixes) }}
    - server: https://kubernetes.default.svc
      namespace: {{ printf "%s*" . }}
    {{- end }}
    {{- end }}
    {{- if eq $item.key "builder" }}
    - server: https://kubernetes.default.svc
      namespace: kuberploy-build-dind
    {{- end }}
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    # Multiple independently reconciled releases intentionally share the
    # protected control-plane namespace. Per-project orphan warnings there are
    # false positives for sibling resources; dedicated namespaces keep them.
    warn: {{ ne $item.namespace "kuberploy-system" }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $item.application }}
  namespace: argocd
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-wave: {{ $item.wave | quote }}
    kuberploy.io/installation-mode: {{ $component.mode | quote }}
    kuberploy.io/expected-package-version: {{ $component.expectedPackageVersion | quote }}
    kuberploy.io/readiness-contract: application-health-is-not-runtime-readiness
  labels:
    {{- include "kuberploy-installer.labels" $root | nindent 4 }}
    kuberploy.io/component: {{ $item.key | quote }}
spec:
  project: {{ $item.application }}
  sources:
    - repoURL: {{ $root.Values.source.chartRepository | quote }}
      chart: {{ $item.chart | quote }}
      targetRevision: {{ $component.expectedPackageVersion | quote }}
      helm:
        releaseName: {{ $item.release | quote }}
        ignoreMissingValueFiles: false
        {{- with $component.valueFiles }}
        valueFiles:
          {{- range uniq (sortAlpha .) }}
          - {{ printf "$values/%s" . | quote }}
          {{- end }}
        {{- end }}
        valuesObject:
          {{- toYaml $childValues | nindent 10 }}
    - repoURL: {{ $root.Values.source.valuesRepository | quote }}
      targetRevision: {{ $root.Values.source.valuesRevision | quote }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $item.namespace }}
  {{- if eq $item.key "postgresql" }}
  # Kubernetes defaults these fields inside the immutable claim template.
  # Ignore only those defaults; every operator-owned PostgreSQL field remains
  # drift-enforced by Argo CD.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: kuberploy-postgresql
      namespace: kuberploy-system
      jsonPointers:
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/metadata/labels/helm.sh~1chart
        - /spec/volumeClaimTemplates/0/spec/volumeMode
        - /spec/volumeClaimTemplates/0/status
  {{- else if eq $item.key "registry" }}
  # Offline garbage collection temporarily scales the fixed single-replica
  # registry to zero under a durable, identity-fenced maintenance lease. Argo
  # must not self-heal that one field while the worker owns the lease; the
  # worker restores it to the chart's fixed value before releasing the lease.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: registry
      namespace: kuberploy-system
      jsonPointers:
        - /spec/replicas
  {{- end }}
  syncPolicy:
    {{- if $root.Values.applications.automated }}
    automated:
      allowEmpty: false
      prune: {{ $root.Values.applications.prune }}
      selfHeal: {{ $root.Values.applications.selfHeal }}
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
      {{- if eq $item.key "registry" }}
      # The registry route uses Traefik CRDs installed by the edge child
      # Application. On an empty cluster those CRDs can appear after Argo has
      # started the registry dry-run, so let the real apply wait for discovery
      # instead of exhausting the child retry budget during bootstrap.
      - SkipDryRunOnMissingResource=true
      {{- end }}
---
{{ end }}
{{ end }}
{{- end -}}

{{- include "kuberploy-installer.validate" . -}}
{{- $anyChild := false -}}
{{- $catalog := include "kuberploy-installer.applicationCatalog" . | fromYamlArray -}}
{{- $enabledApplications := list -}}
{{- range $item := $catalog -}}
  {{- $component := get $.Values.components $item.key -}}
  {{- if $component.enabled -}}
    {{- $anyChild = true -}}
    {{- $enabledApplications = append $enabledApplications (dict
      "name" $item.application
      "component" $item.key
      "chart" $item.chart
      "namespace" $item.namespace
      "mode" $component.mode
      "targetPackageVersion" $component.expectedPackageVersion
    ) -}}
  {{- end -}}
{{- end -}}
{{- if $anyChild }}
{{- $applicationDocuments := include "kuberploy-installer.applicationDocuments" . -}}
{{- $inventory := dict "schemaVersion" 1 "namespace" "argocd" "installerRelease" .Release.Name "applications" $enabledApplications -}}
{{- $inventoryJSON := toJson $inventory -}}
{{- $manifestConfigMapName := printf "kuberploy-installer-applications-%s" (printf "%s\n%s" $applicationDocuments $inventoryJSON | sha256sum | trunc 12) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $manifestConfigMapName }}
  namespace: argocd
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
    app.kubernetes.io/component: application-inventory
immutable: true
data:
  inventory.json: {{ $inventoryJSON | quote }}
  applications.yaml: |
    {{- $applicationDocuments | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberploy-installer-application-reconciler
  namespace: argocd
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuberploy-installer-application-reconciler
  namespace: argocd
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuberploy-installer-application-reconciler
  namespace: argocd
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuberploy-installer-application-reconciler
subjects:
  - kind: ServiceAccount
    name: kuberploy-installer-application-reconciler
    namespace: argocd
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kuberploy-installer-application-reconciler
  namespace: argocd
  annotations:
    helm.sh/hook: post-install,post-upgrade,post-rollback
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "kuberploy-installer.labels" . | nindent 8 }}
        app.kubernetes.io/component: application-reconciler
    spec:
      serviceAccountName: kuberploy-installer-application-reconciler
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile
          image: {{ .Values.bootstrap.applicationReconcilerImage | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - apply
            - --server-side=true
            - --field-manager=kuberploy-installer
            - --force-conflicts
            - --filename=/manifests/applications.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: manifests
              mountPath: /manifests
              readOnly: true
      volumes:
        - name: manifests
          configMap:
            name: {{ $manifestConfigMapName }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberploy-installer-application-health
  namespace: argocd
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
    app.kubernetes.io/component: application-health
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuberploy-installer-application-health
  namespace: argocd
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
    app.kubernetes.io/component: application-health
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames:
      {{- range $application := $enabledApplications }}
      - {{ $application.name }}
      {{- end }}
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuberploy-installer-application-health
  namespace: argocd
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
    app.kubernetes.io/component: application-health
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuberploy-installer-application-health
subjects:
  - kind: ServiceAccount
    name: kuberploy-installer-application-health
    namespace: argocd
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kuberploy-installer-application-health
  namespace: argocd
  annotations:
    helm.sh/hook: post-install,post-upgrade,post-rollback
    helm.sh/hook-weight: "30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "kuberploy-installer.labels" . | nindent 4 }}
    app.kubernetes.io/component: application-health
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ add .Values.bootstrap.applicationHealthTimeoutSeconds 60 }}
  template:
    metadata:
      labels:
        {{- include "kuberploy-installer.labels" . | nindent 8 }}
        app.kubernetes.io/component: application-health
    spec:
      serviceAccountName: kuberploy-installer-application-health
      automountServiceAccountToken: true
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- range $application := $enabledApplications }}
        {{- $checks := list
          (dict "name" "desired-revision" "path" ".spec.sources[0].targetRevision" "expected" $application.targetPackageVersion)
          (dict "name" "observed-revision" "path" ".status.sync.revisions[0]" "expected" $application.targetPackageVersion)
          (dict "name" "sync" "path" ".status.sync.status" "expected" "Synced")
          (dict "name" "health" "path" ".status.health.status" "expected" "Healthy")
        -}}
        {{- range $check := $checks }}
        - name: {{ printf "verify-%s-%s" ($application.component | kebabcase) $check.name }}
          image: {{ $.Values.bootstrap.applicationReconcilerImage | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - wait
            - {{ printf "--for=jsonpath={%s}=%s" $check.path $check.expected | quote }}
            - {{ printf "--timeout=%ds" (int $.Values.bootstrap.applicationHealthTimeoutSeconds) | quote }}
            - {{ printf "applications.argoproj.io/%s" $application.name | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              cpu: 50m
              memory: 64Mi
        {{- end }}
        {{- end }}
{{- end }}
