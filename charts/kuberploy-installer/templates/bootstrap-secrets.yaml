{{- if and .Values.bootstrap.argoCD.enabled (eq .Values.bootstrap.argoCD.mode "managed") }}
{{- $valkeyAuth := lookup "v1" "Secret" "kuberploy-system" "kuberploy-valkey-auth" -}}
{{- $healthPassword := (randAlphaNum 64 | b64enc) -}}
{{- $cachePassword := (randAlphaNum 64 | b64enc) -}}
{{- $limiterPassword := (randAlphaNum 64 | b64enc) -}}
{{- $publisherPassword := (randAlphaNum 64 | b64enc) -}}
{{- $consumerPassword := (randAlphaNum 64 | b64enc) -}}
{{- $argoPassword := (randAlphaNum 64 | b64enc) -}}
{{- if $valkeyAuth -}}
  {{- $healthPassword = index $valkeyAuth.data "health-password" -}}
  {{- $cachePassword = index $valkeyAuth.data "api-cache-password" -}}
  {{- $limiterPassword = index $valkeyAuth.data "api-limiter-password" -}}
  {{- $publisherPassword = index $valkeyAuth.data "outbox-publisher-password" -}}
  {{- $consumerPassword = index $valkeyAuth.data "worker-consumer-password" -}}
  {{- $argoPassword = index $valkeyAuth.data "argocd-password" -}}
{{- end -}}
{{- $postgresAuth := lookup "v1" "Secret" "kuberploy-system" "kuberploy-postgresql-auth" -}}
{{- $postgresPassword := (randAlphaNum 64 | b64enc) -}}
{{- if $postgresAuth -}}{{- $postgresPassword = index $postgresAuth.data "password" -}}{{- end -}}
{{- $argoSecret := lookup "v1" "Secret" "argocd" "argocd-secret" -}}
{{- $serverSecret := (randAlphaNum 64 | b64enc) -}}
{{- if $argoSecret -}}{{- $serverSecret = index $argoSecret.data "server.secretkey" -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: kuberploy-valkey-auth
  namespace: kuberploy-system
type: Opaque
data:
  health-password: {{ $healthPassword | quote }}
  api-cache-password: {{ $cachePassword | quote }}
  api-limiter-password: {{ $limiterPassword | quote }}
  outbox-publisher-password: {{ $publisherPassword | quote }}
  worker-consumer-password: {{ $consumerPassword | quote }}
  argocd-password: {{ $argoPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kuberploy-valkey
  namespace: kuberploy-system
type: Opaque
data:
  addresses: {{ "kuberploy-valkey.kuberploy-system.svc.cluster.local:6379" | b64enc | quote }}
  username: {{ "default" | b64enc | quote }}
  password: {{ $healthPassword | quote }}
  api-cache-username: {{ "api-cache" | b64enc | quote }}
  api-cache-password: {{ $cachePassword | quote }}
  api-limiter-username: {{ "api-limiter" | b64enc | quote }}
  api-limiter-password: {{ $limiterPassword | quote }}
  outbox-publisher-username: {{ "outbox-publisher" | b64enc | quote }}
  outbox-publisher-password: {{ $publisherPassword | quote }}
  worker-consumer-username: {{ "worker-consumer" | b64enc | quote }}
  worker-consumer-password: {{ $consumerPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kuberploy-argocd-valkey-auth
  namespace: argocd
type: Opaque
data:
  redis-username: {{ "argocd" | b64enc | quote }}
  redis-password: {{ $argoPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
type: Opaque
data:
  server.secretkey: {{ $serverSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kuberploy-postgresql-auth
  namespace: kuberploy-system
type: Opaque
data:
  username: {{ "kuberploy" | b64enc | quote }}
  password: {{ $postgresPassword | quote }}
  database: {{ "kuberploy" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kuberploy-postgresql
  namespace: kuberploy-system
type: Opaque
data:
  url: {{ printf "postgres://kuberploy:%s@kuberploy-postgresql.kuberploy-system.svc.cluster.local:5432/kuberploy?sslmode=disable" ($postgresPassword | b64dec) | b64enc | quote }}
{{- end }}
