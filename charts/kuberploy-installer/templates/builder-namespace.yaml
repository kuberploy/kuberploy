{{- if or .Values.components.builder.enabled .Values.integrations.github.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: kuberploy-build-dind
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: kuberploy-builder
    app.kubernetes.io/part-of: kuberploy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    kuberploy.io/builder-namespace: dind
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
