{{- if and .Values.foundation.enabled .Values.foundation.externalDNS.managed .Values.foundation.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-external-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberploy-external-dns.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kuberploy-external-dns
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kuberploy.io/monitoring-namespace: "true"
      ports:
        - {port: 7979, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        {{- range .Values.foundation.networkPolicy.kubeAPIServerCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
    - to:
        {{- range .Values.foundation.networkPolicy.providerEgressCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        {{- range .Values.foundation.networkPolicy.providerEgressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
