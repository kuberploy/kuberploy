{{- if and .Values.foundation.enabled .Values.foundation.externalDNS.managed .Values.foundation.networkPolicy.enabled }}
{{- $configuredAPICIDRs := .Values.foundation.networkPolicy.kubeAPIServerCIDRs }}
{{- $apiCIDRs := $configuredAPICIDRs }}
{{- if empty $apiCIDRs }}{{- $apiCIDRs = list "0.0.0.0/0" "::/0" }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-external-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberploy-external-dns.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kuberploy-external-dns
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kuberploy.io/monitoring-namespace: "true"
      ports:
        - {port: 7979, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        {{- range $apiCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
    - to:
        {{- $providerCIDRs := .Values.foundation.networkPolicy.providerEgressCIDRs -}}
        {{- $defaultProviderEgress := empty $providerCIDRs -}}
        {{- if $defaultProviderEgress -}}{{- $providerCIDRs = list "0.0.0.0/0" "::/0" -}}{{- end -}}
        {{- range $providerCIDR := $providerCIDRs }}
        - ipBlock:
            cidr: {{ $providerCIDR | quote }}
            {{- if $defaultProviderEgress }}
            {{- $exclusions := list -}}
            {{- range $apiCIDR := $configuredAPICIDRs -}}
              {{- if or (and (contains "." $providerCIDR) (contains "." $apiCIDR)) (and (contains ":" $providerCIDR) (contains ":" $apiCIDR)) -}}
                {{- $exclusions = append $exclusions $apiCIDR -}}
              {{- end -}}
            {{- end -}}
            {{- with $exclusions }}
            except:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
        {{- end }}
      ports:
        {{- range .Values.foundation.networkPolicy.providerEgressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-private-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberploy-external-dns.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
{{- end }}
