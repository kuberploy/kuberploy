{{- if .Values.config.bootstrapSecret.generate }}
{{- $name := printf "%s-bootstrap-token" (include "kuberploy.fullname" .) }}
{{- if .Values.networkPolicy.enabled }}
{{- $apiCIDRs := .Values.networkPolicy.kubeAPIServerCIDRs }}
{{- if empty $apiCIDRs }}{{- $apiCIDRs = list "0.0.0.0/0" "::/0" }}{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap-token
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-21"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      {{- include "kuberploy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: bootstrap-token
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        {{- range $apiCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap-token
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap-token
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap-token
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-19"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap-token
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.config.bootstrapSecret.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "kuberploy.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap-token
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: {{ .Values.components.api.image.reference | quote }}
          imagePullPolicy: {{ .Values.components.api.image.pullPolicy }}
          command: ["/kuberploy-bootstrap-token"]
          env:
            - name: KUBERPLOY_BOOTSTRAP_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: KUBERPLOY_BOOTSTRAP_SECRET_NAME
              value: {{ .Values.config.bootstrapSecret.name | quote }}
            - name: KUBERPLOY_BOOTSTRAP_SECRET_KEY
              value: {{ .Values.config.bootstrapSecret.tokenKey | quote }}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
