{{- range $component := list "api" "worker" "web" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kuberploy.componentName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
automountServiceAccountToken: {{ if eq $component "web" }}false{{ else }}true{{ end }}
{{- end }}
{{- if .Values.config.helmApplications.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kuberploy.helmRendererServiceAccount" . }}
  namespace: {{ .Values.config.helmApplications.rendererNamespace }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-renderer
automountServiceAccountToken: false
{{- end }}
