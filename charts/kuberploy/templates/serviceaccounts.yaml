{{- range $component := list "api" "worker" "web" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kuberploy.componentName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
automountServiceAccountToken: {{ if eq $component "web" }}false{{ else }}true{{ end }}
{{- end }}
