apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kuberploy.fullname" . }}-upgrade
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kuberploy.fullname" . }}-migration
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    kuberploy.io/ownership-boundary: database-migration-only
spec:
  backoffLimit: {{ .Values.databaseMigration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.databaseMigration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "kuberploy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "kuberploy.image" (dict "root" . "component" "migration" "config" .Values.components.migration) | quote }}
          imagePullPolicy: {{ .Values.components.migration.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.postgresql.secretRef.name }}
                  key: {{ .Values.config.postgresql.secretRef.urlKey }}
          resources:
            {{- toYaml .Values.components.migration.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
