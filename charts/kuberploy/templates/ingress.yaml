{{- if .Values.ingress.tls.redirectHttp }}
  {{- if not .Values.ingress.enabled }}
    {{- fail "ingress.tls.redirectHttp requires ingress.enabled" }}
  {{- end }}
  {{- if not .Values.ingress.tls.enabled }}
    {{- fail "ingress.tls.redirectHttp requires ingress.tls.enabled" }}
  {{- end }}
  {{- if ne .Values.ingress.className "traefik" }}
    {{- fail "ingress.tls.redirectHttp requires the traefik IngressClass" }}
  {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.tls.redirectHttp }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "kuberploy.fullname" . }}-https
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kuberploy.fullname" . }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    {{- if eq .Values.ingress.className "traefik" }}
    traefik.ingress.kubernetes.io/router.entrypoints: {{ ternary "websecure" "web" .Values.ingress.tls.enabled | quote }}
    {{- if .Values.ingress.tls.enabled }}
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.tls.issuerName }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ required "ingress.tls.secretName is required when TLS is enabled" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.config.githubApp.enabled }}
          - path: /v1/github/installations/setup
            pathType: Exact
            backend:
              service:
                name: {{ include "kuberploy.componentName" (dict "root" . "component" "api") }}
                port:
                  name: http
          - path: /v1/github/installations/callback
            pathType: Exact
            backend:
              service:
                name: {{ include "kuberploy.componentName" (dict "root" . "component" "api") }}
                port:
                  name: http
          - path: /v1/webhooks/github
            pathType: Exact
            backend:
              service:
                name: {{ include "kuberploy.componentName" (dict "root" . "component" "api") }}
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kuberploy.componentName" (dict "root" . "component" "web") }}
                port:
                  name: http
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.tls.redirectHttp }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kuberploy.fullname" . }}-redirect
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-https@kubernetescrd" .Release.Namespace (include "kuberploy.fullname" .) | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kuberploy.componentName" (dict "root" . "component" "web") }}
                port:
                  name: http
{{- end }}
