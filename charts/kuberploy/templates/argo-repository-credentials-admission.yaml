{{- if .Values.config.argoDesiredState.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kuberploy.argoRepositoryCredentialAdmissionPolicyName" . }}
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" . "component" "argo-repository-credentials-admission") | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
        scope: Namespaced
  # Do not interfere with Argo CD or operator-owned Secrets in its namespace.
  # This policy closes only the mutation surface granted to Kuberploy's worker.
  matchConditions:
    - name: exact-kuberploy-worker
      expression: {{ printf "request.userInfo.username == '%s'" (include "kuberploy.argoDesiredStateWorkerUsername" .) | quote }}
    - name: exact-argo-namespace
      expression: {{ printf "request.namespace == '%s'" .Values.config.argoDesiredState.namespace | quote }}
  validations:
    - expression: >-
        request.operation == 'DELETE' ||
        (object.apiVersion == 'v1' && object.kind == 'Secret' &&
        object.metadata.namespace == request.namespace &&
        object.metadata.name.matches('^kuberploy-repo-[0-9a-f]{32}$') &&
        (!has(object.metadata.generateName) || object.metadata.generateName == '') &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) &&
        !has(object.metadata.deletionTimestamp) &&
        has(object.metadata.labels) && object.metadata.labels.size() == 4 &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'kuberploy' &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'kuberploy' &&
        object.metadata.labels['argocd.argoproj.io/secret-type'] == 'repository' &&
        object.metadata.labels['kuberploy.io/git-binding-id'].matches('^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$') &&
        object.metadata.name == 'kuberploy-repo-' + object.metadata.labels['kuberploy.io/git-binding-id'].replace('-', '') &&
        has(object.metadata.annotations) && object.metadata.annotations.size() == 2 &&
        object.metadata.annotations['kuberploy.io/repository-spec-digest'].matches('^sha256:[0-9a-f]{64}$') &&
        object.metadata.annotations['kuberploy.io/credential-contract'] == 'github-app-repository-v1')
      message: Argo repository credentials require the exact deterministic Kuberploy identity envelope
    - expression: >-
        request.operation == 'DELETE' ||
        (object.type == 'Opaque' && has(object.data) && object.data.size() == 5 &&
        'type' in object.data && 'url' in object.data && 'githubAppID' in object.data &&
        'githubAppInstallationID' in object.data && 'githubAppPrivateKey' in object.data &&
        object.data['type'].size() >= 1 && object.data['type'].size() <= 16 &&
        object.data['url'].size() >= 1 && object.data['url'].size() <= 2048 &&
        object.data['githubAppID'].size() >= 1 && object.data['githubAppID'].size() <= 19 &&
        object.data['githubAppInstallationID'].size() >= 1 && object.data['githubAppInstallationID'].size() <= 19 &&
        object.data['githubAppPrivateKey'].size() >= 1 && object.data['githubAppPrivateKey'].size() <= 131072 &&
        (!has(object.stringData) || object.stringData.size() == 0) &&
        (!has(object.immutable) || object.immutable == false))
      message: Argo repository credentials require exactly five bounded Opaque data keys and no stringData
    - expression: >-
        request.operation != 'UPDATE' ||
        (oldObject.apiVersion == 'v1' && oldObject.kind == 'Secret' &&
        oldObject.metadata.namespace == request.namespace && oldObject.metadata.name == request.name &&
        oldObject.metadata.name.matches('^kuberploy-repo-[0-9a-f]{32}$') &&
        has(oldObject.metadata.labels) && oldObject.metadata.labels.size() == 4 &&
        oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'kuberploy' &&
        oldObject.metadata.labels['app.kubernetes.io/part-of'] == 'kuberploy' &&
        oldObject.metadata.labels['argocd.argoproj.io/secret-type'] == 'repository' &&
        oldObject.metadata.labels['kuberploy.io/git-binding-id'].matches('^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$') &&
        oldObject.metadata.name == 'kuberploy-repo-' + oldObject.metadata.labels['kuberploy.io/git-binding-id'].replace('-', '') &&
        has(oldObject.metadata.annotations) && oldObject.metadata.annotations.size() == 2 &&
        oldObject.metadata.annotations['kuberploy.io/repository-spec-digest'].matches('^sha256:[0-9a-f]{64}$') &&
        oldObject.metadata.annotations['kuberploy.io/credential-contract'] == 'github-app-repository-v1' &&
        oldObject.type == 'Opaque' && has(oldObject.data) && oldObject.data.size() == 5 &&
        'type' in oldObject.data && 'url' in oldObject.data && 'githubAppID' in oldObject.data &&
        'githubAppInstallationID' in oldObject.data && 'githubAppPrivateKey' in oldObject.data)
      message: updates may adopt only an exact existing Kuberploy-managed Argo repository credential
    - expression: >-
        request.operation != 'DELETE' ||
        (oldObject.apiVersion == 'v1' && oldObject.kind == 'Secret' &&
        oldObject.metadata.namespace == request.namespace && oldObject.metadata.name == request.name &&
        oldObject.metadata.name.matches('^kuberploy-repo-[0-9a-f]{32}$') &&
        has(oldObject.metadata.labels) && oldObject.metadata.labels.size() == 4 &&
        oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'kuberploy' &&
        oldObject.metadata.labels['app.kubernetes.io/part-of'] == 'kuberploy' &&
        oldObject.metadata.labels['argocd.argoproj.io/secret-type'] == 'repository' &&
        oldObject.metadata.labels['kuberploy.io/git-binding-id'].matches('^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$') &&
        oldObject.metadata.name == 'kuberploy-repo-' + oldObject.metadata.labels['kuberploy.io/git-binding-id'].replace('-', '') &&
        has(oldObject.metadata.annotations) && oldObject.metadata.annotations.size() == 2 &&
        oldObject.metadata.annotations['kuberploy.io/repository-spec-digest'].matches('^sha256:[0-9a-f]{64}$') &&
        oldObject.metadata.annotations['kuberploy.io/credential-contract'] == 'github-app-repository-v1' &&
        oldObject.type == 'Opaque' && has(oldObject.data) && oldObject.data.size() == 5 &&
        'type' in oldObject.data && 'url' in oldObject.data && 'githubAppID' in oldObject.data &&
        'githubAppInstallationID' in oldObject.data && 'githubAppPrivateKey' in oldObject.data)
      message: deletion is limited to an exact existing Kuberploy-managed Argo repository credential
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "kuberploy.argoRepositoryCredentialAdmissionPolicyName" . }}
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" . "component" "argo-repository-credentials-admission") | nindent 4 }}
spec:
  policyName: {{ include "kuberploy.argoRepositoryCredentialAdmissionPolicyName" . }}
  validationActions: [Deny]
  matchResources:
    matchPolicy: Exact
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.config.argoDesiredState.namespace }}
{{- end }}
