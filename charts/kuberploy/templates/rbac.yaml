apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kuberploy.fullname" . }}-api-observer
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kuberploy.fullname" . }}-api-observer
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kuberploy.componentName" (dict "root" . "component" "api") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kuberploy.fullname" . }}-api-observer
