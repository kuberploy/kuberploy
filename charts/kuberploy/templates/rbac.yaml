{{- if or .Values.config.edgeRuntime.profiles.traefik .Values.config.edgeRuntime.profiles.certManager }}
{{- $clusterRoleName := include "kuberploy.edgeRBACName" (dict "root" . "kind" "cluster" "namespace" "cluster" "identity" "edge-runtime-v1") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" . "component" "edge-runtime") | nindent 4 }}
rules:
  {{- with .Values.config.edgeRuntime.profiles.traefik }}
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    resourceNames: [{{ .ingressClass.name | quote }}]
    verbs: ["get"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      {{- range .crds }}
      - {{ .name | quote }}
      {{- end }}
    verbs: ["get"]
  {{- end }}
  {{- with .Values.config.edgeRuntime.profiles.certManager }}
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      {{- range .crds }}
      - {{ .name | quote }}
      {{- end }}
    verbs: ["get"]
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    resourceNames:
      {{- if .productionIssuer }}
      - {{ .productionIssuer | quote }}
      {{- end }}
      {{- if .stagingIssuer }}
      - {{ .stagingIssuer | quote }}
      {{- end }}
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" . "component" "edge-runtime") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kuberploy.componentName" (dict "root" . "component" "worker") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterRoleName }}
{{- end }}
{{- end }}
