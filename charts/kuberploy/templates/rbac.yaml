    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: [{{ .Values.config.managedRegistry.deployment | quote }}]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: [{{ .Values.config.managedRegistry.persistentVolumeClaim | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.config.managedRegistry.registryConfigMap | quote }}]
    verbs: ["get"]
  # Kubernetes does not authorize create by resourceName. The worker's closed
  # REST client admits only deterministic, exact maintenance Job specs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kuberploy.fullname" . }}-registry-maintenance-controller
  namespace: {{ .Values.config.managedRegistry.namespace }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry-maintenance-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "kuberploy.componentName" (dict "root" . "component" "worker") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kuberploy.fullname" . }}-registry-maintenance-controller
{{- end }}
