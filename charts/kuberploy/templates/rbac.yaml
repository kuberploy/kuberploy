{{- if .Values.config.argoDesiredState.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kuberploy.fullname" $ }}-argo-desired-state
  namespace: {{ .Values.config.argoDesiredState.namespace }}
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" $ "component" "argo-desired-state") | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["kuberploy-platform-root"]
    verbs: ["get", "patch"]
  # Server-Side Apply is authorized as create for an absent object and patch
  # for an existing object. Admission below confines all three mutation verbs
  # to the deterministic repository-credential family; no Secret read exists.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kuberploy.fullname" $ }}-argo-desired-state
  namespace: {{ .Values.config.argoDesiredState.namespace }}
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" $ "component" "argo-desired-state") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kuberploy.componentName" (dict "root" $ "component" "worker") }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kuberploy.fullname" $ }}-argo-desired-state
{{- end }}
