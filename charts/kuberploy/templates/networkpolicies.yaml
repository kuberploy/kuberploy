{{- include "kuberploy.validateNetworkPolicy" . -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy.fullname" . }}-default-deny
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kuberploy.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy.fullname" . }}-dns
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kuberploy.selectorLabels" . | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy.fullname" . }}-web
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kuberploy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.edgeNamespace }}
      ports:
        - {port: {{ .Values.components.web.port }}, protocol: TCP}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "kuberploy.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - {port: {{ .Values.components.api.port }}, protocol: TCP}
{{- range $component := list "api" "worker" "upgrade" }}
{{- $externalPorts := dict -}}
{{- if eq $component "worker" -}}
  {{- $_ := set $externalPorts "22" true -}}
  {{- $_ := set $externalPorts "9418" true -}}
{{- end -}}
{{- $_ := set $externalPorts "443" true -}}
{{- if and $.Values.config.helmApplications.enabled (or (eq $component "api") (eq $component "worker")) -}}
  {{- range $host := concat $.Values.config.helmApplications.ociRegistryHosts $.Values.config.helmApplications.ociAuthHosts -}}
    {{- $parts := splitList ":" $host -}}
    {{- $port := "443" -}}
    {{- if eq (len $parts) 2 -}}
      {{- $port = index $parts 1 -}}
    {{- end -}}
    {{- $_ := set $externalPorts $port true -}}
  {{- end -}}
{{- end }}
{{- if eq $component "api" -}}
  {{- range $profile := $.Values.config.runtimeRegistryPulls.profiles -}}
    {{- $parts := splitList ":" $profile.registryServer -}}
    {{- $port := "443" -}}
    {{- if eq (len $parts) 2 -}}
      {{- $port = index $parts 1 -}}
    {{- end -}}
    {{- $_ := set $externalPorts $port true -}}
  {{- end -}}
  {{- range $authority := $.Values.config.imageTagResolution.tokenAuthorities -}}
    {{- $origin := regexFind `^https://[^/]+` $authority.realmUrl | trimPrefix "https://" -}}
    {{- $parts := splitList ":" $origin -}}
    {{- $port := "443" -}}
    {{- if eq (len $parts) 2 -}}
      {{- $port = index $parts 1 -}}
    {{- end -}}
    {{- $_ := set $externalPorts $port true -}}
  {{- end -}}
{{- end -}}
{{ printf "\n" }}---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy.fullname" $ }}-{{ $component }}
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kuberploy.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes: ["Ingress", "Egress"]
  {{- if eq $component "api" }}
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.edgeNamespace }}
      ports:
        - {port: {{ $.Values.components.api.port }}, protocol: TCP}
  {{- else }}
  ingress: []
  {{- end }}
  {{- if and (eq $component "upgrade") (empty $.Values.networkPolicy.kubeAPIServerCIDRs) (empty $.Values.networkPolicy.externalEgressCIDRs) }}
  egress: []
  {{- else }}
  egress:
    {{- if and (eq $component "api") (eq $.Values.config.monitoring.mode "managed") }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kuberploy-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {port: 9090, protocol: TCP}
    {{- end }}
    {{- if or (eq $component "api") (eq $component "worker") }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.managedPostgreSQLNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kuberploy-postgresql
      ports:
        - {port: 5432, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.managedValkeyNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - {port: 6379, protocol: TCP}
    {{- range $.Values.networkPolicy.externalPostgreSQLEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - {port: 5432, protocol: TCP}
    {{- end }}
    {{- range $.Values.networkPolicy.externalValkeyEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - {port: 6379, protocol: TCP}
    {{- end }}
    {{- end }}
    {{- if and (eq $component "worker") $.Values.config.managedRegistry.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.config.managedRegistry.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kuberploy-registry
              app.kubernetes.io/instance: {{ $.Values.config.managedRegistry.deployment }}
              app.kubernetes.io/component: registry
      ports:
        - {port: {{ $.Values.config.managedRegistry.servicePort }}, protocol: TCP}
    {{- end }}
    {{- if and $.Values.networkPolicy.kubeAPIServerCIDRs (or (eq $component "worker") (eq $component "upgrade") (and (eq $component "api") (or (eq $.Values.config.monitoring.mode "managed") $.Values.rbac.observedNamespaces $.Values.config.runtimeSecrets.enabled $.Values.config.buildLogs.enabled))) }}
    - to:
        {{- range $.Values.networkPolicy.kubeAPIServerCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
    {{- end }}
    {{- range $.Values.networkPolicy.externalEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        {{- range $port := sortAlpha (keys $externalPorts) }}
        - {port: {{ atoi $port }}, protocol: TCP}
        {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.builder.enabled .Values.config.managedRegistry.enabled }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kuberploy-builder-managed-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["networkpolicies"]
        scope: Namespaced
  matchConditions:
    - name: static-managed-registry-only
      expression: "object.metadata.name == 'kuberploy-builder-managed-registry'"
  validations:
    - expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:argocd-application-controller'" .Values.rbac.argoNamespace | quote }}
      message: only the configured Argo CD controller may reconcile static managed-registry egress
    - expression: {{ printf "object.metadata.name == 'kuberploy-builder-managed-registry' && object.metadata.namespace == '%s'" .Values.builder.namespace.name | quote }}
      message: static managed-registry egress requires the exact server-owned identity
    - expression: "object.spec.podSelector.matchLabels.size() == 2 && (!has(object.spec.podSelector.matchExpressions) || object.spec.podSelector.matchExpressions.size() == 0) && object.spec.podSelector.matchLabels['app.kubernetes.io/name'] == 'kuberploy-builder' && object.spec.podSelector.matchLabels['app.kubernetes.io/component'] == 'source-build'"
      message: static managed-registry egress must select only source-build pods
    - expression: "object.spec.policyTypes.size() == 1 && object.spec.policyTypes[0] == 'Egress' && (!has(object.spec.ingress) || object.spec.ingress.size() == 0) && object.spec.egress.size() == 1"
      message: static managed-registry policy must contain exactly one egress rule
    - expression: {{ printf "object.spec.egress[0].to.size() == 1 && object.spec.egress[0].to[0].namespaceSelector.matchLabels.size() == 1 && (!has(object.spec.egress[0].to[0].namespaceSelector.matchExpressions) || object.spec.egress[0].to[0].namespaceSelector.matchExpressions.size() == 0) && object.spec.egress[0].to[0].namespaceSelector.matchLabels['kubernetes.io/metadata.name'] == '%s' && object.spec.egress[0].to[0].podSelector.matchLabels.size() == 3 && (!has(object.spec.egress[0].to[0].podSelector.matchExpressions) || object.spec.egress[0].to[0].podSelector.matchExpressions.size() == 0) && object.spec.egress[0].to[0].podSelector.matchLabels['app.kubernetes.io/name'] == 'kuberploy-registry' && object.spec.egress[0].to[0].podSelector.matchLabels['app.kubernetes.io/instance'] == '%s' && object.spec.egress[0].to[0].podSelector.matchLabels['app.kubernetes.io/component'] == 'registry' && object.spec.egress[0].ports.size() == 1 && object.spec.egress[0].ports[0].protocol == 'TCP' && object.spec.egress[0].ports[0].port == %v && !has(object.spec.egress[0].ports[0].endPort)" .Values.config.managedRegistry.namespace .Values.config.managedRegistry.deployment .Values.config.managedRegistry.servicePort | quote }}
      message: static managed-registry egress must target only the exact registry pod and port
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kuberploy-builder-managed-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
spec:
  policyName: kuberploy-builder-managed-registry
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.builder.namespace.name }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kuberploy-builder-managed-registry
  namespace: {{ .Values.builder.namespace.name }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    kuberploy.io/static-registry-egress: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kuberploy-builder
      app.kubernetes.io/component: source-build
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.config.managedRegistry.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kuberploy-registry
              app.kubernetes.io/instance: {{ .Values.config.managedRegistry.deployment }}
              app.kubernetes.io/component: registry
      ports:
        - {port: {{ .Values.config.managedRegistry.servicePort }}, protocol: TCP}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy.fullname" . }}-migration
  labels:
    {{- include "kuberploy.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-9"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "kuberploy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migration
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.managedPostgreSQLNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kuberploy-postgresql
      ports:
        - {port: 5432, protocol: TCP}
    {{- range .Values.networkPolicy.externalPostgreSQLEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - {port: 5432, protocol: TCP}
    {{- end }}
{{- if .Values.config.managedRegistry.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy.fullname" . }}-registry-maintenance-deny-network
  namespace: {{ .Values.config.managedRegistry.namespace }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry-maintenance
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kuberploy
      app.kubernetes.io/component: registry-maintenance
      kuberploy.io/registry-target: {{ .Values.config.managedRegistry.targetID | quote }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
{{- end }}
{{- if .Values.config.helmApplications.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberploy.fullname" . }}-helm-renderer-default-deny
  namespace: {{ .Values.config.helmApplications.rendererNamespace }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-renderer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kuberploy-worker
      app.kubernetes.io/component: helm-renderer
      app.kubernetes.io/managed-by: kuberploy
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
{{- end }}
{{- end }}
