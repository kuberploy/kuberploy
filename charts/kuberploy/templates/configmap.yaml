  {{- fail "managed registry maintenance requires networkPolicy.enabled" -}}
  {{- end -}}
  {{- if eq .Values.config.managedRegistry.credentialSecret.usernameKey .Values.config.managedRegistry.credentialSecret.passwordKey -}}
  {{- fail "managed registry username and password Secret keys must be distinct" -}}
  {{- end -}}
  {{- $credentialRefs := list .Values.config.managedRegistry.lifecycleCredentialRef .Values.config.managedRegistry.pullCredentialRef .Values.config.managedRegistry.pushCredentialRef .Values.config.managedRegistry.cacheCredentialRef -}}
  {{- if ne (len (uniq $credentialRefs)) 4 -}}
  {{- fail "managed registry lifecycle, pull, push, and cache credential references must be distinct" -}}
  {{- end -}}
  {{- if not (regexMatch "@sha256:[a-f0-9]{64}$" .Values.components.worker.image.reference) -}}
  {{- fail "managed registry maintenance requires a digest-pinned worker image" -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kuberploy.configName" . }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
immutable: true
data:
  KUBERPLOY_PUBLIC_URL: {{ .Values.config.publicURL | quote }}
  KUBERPLOY_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  KUBERPLOY_MONITORING_MODE: {{ .Values.config.monitoring.mode | quote }}
  KUBERPLOY_PROMETHEUS_URL: {{ .Values.config.monitoring.prometheusURL | quote }}
  KUBERPLOY_PROMETHEUS_BEARER_TOKEN_ENABLED: {{ if .Values.config.monitoring.bearerTokenSecret.name }}"true"{{ else }}"false"{{ end }}
  KUBERPLOY_RUNTIME_VIEW_ENABLED: {{ if or .Values.rbac.observedNamespaces .Values.config.environmentFoundation.enabled }}"true"{{ else }}"false"{{ end }}
  KUBERPLOY_GIT_REMOTE: {{ .Values.config.git.remoteURL | quote }}
  KUBERPLOY_GIT_BRANCH: {{ .Values.config.git.branch | quote }}
  KUBERPLOY_GIT_WORKTREE: /var/lib/kuberploy/git
  KUBERPLOY_INGRESS_CLASS: {{ .Values.ingress.className | quote }}
  KUBERPLOY_GITHUB_BUILDS_ENABLED: {{ .Values.config.githubApp.enabled | quote }}
  KUBERPLOY_BUILD_LOGS_ENABLED: {{ .Values.config.buildLogs.enabled | quote }}
  KUBERPLOY_GITHUB_APP_ID: {{ .Values.config.githubApp.appID | int64 | quote }}
  KUBERPLOY_GITHUB_APP_CLIENT_ID: {{ .Values.config.githubApp.clientID | quote }}
  KUBERPLOY_GITHUB_APP_SLUG: {{ .Values.config.githubApp.appSlug | quote }}
  KUBERPLOY_GIT_PROJECTION_ENABLED: {{ .Values.config.gitProjection.enabled | quote }}
  KUBERPLOY_GIT_PROJECTION_AUTH_MODE: {{ ternary "github-app" "disabled" .Values.config.gitProjection.enabled | quote }}
  KUBERPLOY_GIT_PROJECTION_CACHE_MAX_BYTES: {{ .Values.config.gitProjection.cacheMaxBytes | int64 | quote }}
  KUBERPLOY_GIT_PROJECTION_POLL_INTERVAL_SECONDS: {{ .Values.config.gitProjection.pollIntervalSeconds | quote }}
  KUBERPLOY_GIT_PROJECTION_WEBHOOK_WAKE_ENABLED: {{ .Values.config.gitProjection.webhookWakeEnabled | quote }}
  KUBERPLOY_GIT_PROJECTION_CHART_VERSION: {{ .Values.config.gitProjection.chartVersion | quote }}
  KUBERPLOY_GIT_PROJECTION_POLICY_VERSION: {{ .Values.config.gitProjection.policyVersion | quote }}
  KUBERPLOY_AUTO_DEPLOY_ENABLED: {{ .Values.config.autoDeploy.enabled | quote }}
  {{- if .Values.config.platformGitBinding.enabled }}
  KUBERPLOY_PLATFORM_GIT_BINDING_ID: {{ .Values.config.platformGitBinding.bindingID | quote }}
  KUBERPLOY_CLUSTER_ID: {{ .Values.config.platformGitBinding.clusterID | quote }}
  {{- end }}
  KUBERPLOY_RUNTIME_SECRETS_ENABLED: {{ .Values.config.runtimeSecrets.enabled | quote }}
  {{- if .Values.config.runtimeSecrets.enabled }}
  KUBERPLOY_RUNTIME_SECRET_NAMESPACES: {{ join "," .Values.config.runtimeSecrets.namespaces | quote }}
  KUBERPLOY_RUNTIME_SECRET_FINGERPRINT_SECRET_REF: {{ .Values.config.runtimeSecrets.fingerprintSecret.name | quote }}
  KUBERPLOY_RUNTIME_SECRET_FINGERPRINT_SECRET_KEY: {{ .Values.config.runtimeSecrets.fingerprintSecret.key | quote }}
  KUBERPLOY_RUNTIME_SECRET_FINGERPRINT_KEY_ID: {{ .Values.config.runtimeSecrets.fingerprintKeyID | quote }}
  KUBERPLOY_RUNTIME_SECRET_SEALING_CERTIFICATE_SECRET_REF: {{ .Values.config.runtimeSecrets.sealingCertificateSecret.name | quote }}
  KUBERPLOY_RUNTIME_SECRET_SEALING_CERTIFICATE_SECRET_KEY: {{ .Values.config.runtimeSecrets.sealingCertificateSecret.key | quote }}
  KUBERPLOY_RUNTIME_SECRET_POLL_SECONDS: {{ .Values.config.runtimeSecrets.pollIntervalSeconds | quote }}
  KUBERPLOY_RUNTIME_SECRET_WORK_LEASE_SECONDS: {{ .Values.config.runtimeSecrets.workLeaseSeconds | quote }}
  KUBERPLOY_RUNTIME_SECRET_HEARTBEAT_SECONDS: {{ .Values.config.runtimeSecrets.heartbeatSeconds | quote }}
  KUBERPLOY_RUNTIME_SECRET_IDLE_SECONDS: {{ .Values.config.runtimeSecrets.idleSeconds | quote }}
  KUBERPLOY_RUNTIME_SECRET_MINIMUM_BACKOFF_SECONDS: {{ .Values.config.runtimeSecrets.minimumBackoffSeconds | quote }}
  KUBERPLOY_RUNTIME_SECRET_MAXIMUM_BACKOFF_SECONDS: {{ .Values.config.runtimeSecrets.maximumBackoffSeconds | quote }}
  {{- end }}
  KUBERPLOY_CERTIFICATE_OBSERVATION_ENABLED: {{ .Values.config.certificateObservation.enabled | quote }}
  {{- if .Values.config.certificateObservation.enabled }}
  KUBERPLOY_CERTIFICATE_OBSERVATION_POLL_SECONDS: {{ .Values.config.certificateObservation.pollIntervalSeconds | quote }}
  KUBERPLOY_CERTIFICATE_OBSERVATION_WORK_LEASE_SECONDS: {{ .Values.config.certificateObservation.workLeaseSeconds | quote }}
  KUBERPLOY_CERTIFICATE_OBSERVATION_HEARTBEAT_SECONDS: {{ .Values.config.certificateObservation.heartbeatSeconds | quote }}
  KUBERPLOY_CERTIFICATE_OBSERVATION_IDLE_SECONDS: {{ .Values.config.certificateObservation.idleSeconds | quote }}
  KUBERPLOY_CERTIFICATE_OBSERVATION_MINIMUM_BACKOFF_SECONDS: {{ .Values.config.certificateObservation.minimumBackoffSeconds | quote }}
  KUBERPLOY_CERTIFICATE_OBSERVATION_MAXIMUM_BACKOFF_SECONDS: {{ .Values.config.certificateObservation.maximumBackoffSeconds | quote }}
  KUBERPLOY_CERTIFICATE_OBSERVATION_MAXIMUM_AGE_SECONDS: {{ .Values.config.certificateObservation.maximumAgeSeconds | quote }}
  {{- end }}
  KUBERPLOY_CERTIFICATE_ISSUER_OBSERVER_ENABLED: {{ .Values.config.certificateIssuerObserver.enabled | quote }}
  {{- if .Values.config.certificateIssuerObserver.enabled }}
  KUBERPLOY_CERTIFICATE_ISSUER_OBSERVER_BINDING_ID: {{ .Values.config.certificateIssuerObserver.platformBindingID | quote }}
  KUBERPLOY_CERTIFICATE_ISSUER_OBSERVER_CLUSTER_ID: {{ .Values.config.certificateIssuerObserver.clusterID | quote }}
  KUBERPLOY_CERTIFICATE_ISSUER_OBSERVER_NAMESPACE: {{ .Release.Namespace | quote }}
  KUBERPLOY_CERTIFICATE_ISSUER_OBSERVER_SERVICE_ACCOUNT: {{ include "kuberploy.componentName" (dict "root" . "component" "worker") | quote }}
  KUBERPLOY_CERTIFICATE_ISSUER_OBSERVER_POLL_SECONDS: {{ .Values.config.certificateIssuerObserver.pollIntervalSeconds | quote }}
  KUBERPLOY_CERTIFICATE_ISSUER_OBSERVER_REQUEST_TIMEOUT_SECONDS: {{ .Values.config.certificateIssuerObserver.requestTimeoutSeconds | quote }}
  KUBERPLOY_CERTIFICATE_ISSUER_OBSERVER_MAXIMUM_AGE_SECONDS: {{ .Values.config.certificateIssuerObserver.maximumAgeSeconds | quote }}
  KUBERPLOY_CERTIFICATE_ISSUER_OBSERVER_READINESS_LEASE_SECONDS: {{ .Values.config.certificateIssuerObserver.readinessLeaseSeconds | quote }}
  {{- end }}
  KUBERPLOY_RUNTIME_REGISTRY_PULLS_ENABLED: {{ .Values.config.runtimeRegistryPulls.enabled | quote }}
  {{- if .Values.config.runtimeRegistryPulls.enabled }}
  KUBERPLOY_RUNTIME_REGISTRY_PULL_NAMESPACES: {{ join "," .Values.config.runtimeRegistryPulls.namespaces | quote }}
  KUBERPLOY_RUNTIME_REGISTRY_PULL_PROFILES: {{ toJson .Values.config.runtimeRegistryPulls.profiles | quote }}
  KUBERPLOY_RUNTIME_REGISTRY_PULL_POLL_SECONDS: {{ .Values.config.runtimeRegistryPulls.pollIntervalSeconds | quote }}
  KUBERPLOY_RUNTIME_REGISTRY_PULL_WORK_LEASE_SECONDS: {{ .Values.config.runtimeRegistryPulls.workLeaseSeconds | quote }}
  KUBERPLOY_RUNTIME_REGISTRY_PULL_HEARTBEAT_SECONDS: {{ .Values.config.runtimeRegistryPulls.heartbeatSeconds | quote }}
  KUBERPLOY_RUNTIME_REGISTRY_PULL_READINESS_SECONDS: {{ .Values.config.runtimeRegistryPulls.readinessSeconds | quote }}
  KUBERPLOY_RUNTIME_REGISTRY_PULL_MINIMUM_BACKOFF_SECONDS: {{ .Values.config.runtimeRegistryPulls.minimumBackoffSeconds | quote }}
  KUBERPLOY_RUNTIME_REGISTRY_PULL_MAXIMUM_BACKOFF_SECONDS: {{ .Values.config.runtimeRegistryPulls.maximumBackoffSeconds | quote }}
  {{- end }}
  KUBERPLOY_IMAGE_TAG_RESOLUTION_PLATFORM: {{ .Values.config.imageTagResolution.platform | quote }}
  {{- if .Values.config.imageTagResolution.anonymousTargetIds }}
  KUBERPLOY_IMAGE_TAG_RESOLUTION_ANONYMOUS_TARGET_IDS: {{ join "," .Values.config.imageTagResolution.anonymousTargetIds | quote }}
  {{- end }}
  {{- if .Values.config.imageTagResolution.tokenAuthorities }}
  KUBERPLOY_IMAGE_TAG_RESOLUTION_TOKEN_AUTHORITIES: {{ toJson .Values.config.imageTagResolution.tokenAuthorities | quote }}
  {{- end }}
  KUBERPLOY_EDGE_RUNTIME_ENABLED: {{ .Values.config.edgeRuntime.enabled | quote }}
  {{- if .Values.config.edgeRuntime.enabled }}
  KUBERPLOY_EDGE_RUNTIME_PROFILES_JSON: {{ toJson .Values.config.edgeRuntime.profiles | quote }}
  KUBERPLOY_EDGE_RUNTIME_POLL_SECONDS: {{ .Values.config.edgeRuntime.pollIntervalSeconds | quote }}
  KUBERPLOY_EDGE_RUNTIME_WORK_LEASE_SECONDS: {{ .Values.config.edgeRuntime.workLeaseSeconds | quote }}
  KUBERPLOY_EDGE_RUNTIME_HEARTBEAT_SECONDS: {{ .Values.config.edgeRuntime.heartbeatSeconds | quote }}
  KUBERPLOY_EDGE_RUNTIME_READINESS_SECONDS: {{ .Values.config.edgeRuntime.readinessSeconds | quote }}
  KUBERPLOY_EDGE_RUNTIME_MINIMUM_BACKOFF_SECONDS: {{ .Values.config.edgeRuntime.minimumBackoffSeconds | quote }}
  KUBERPLOY_EDGE_RUNTIME_MAXIMUM_BACKOFF_SECONDS: {{ .Values.config.edgeRuntime.maximumBackoffSeconds | quote }}
  {{- end }}
  KUBERPLOY_EXTERNAL_DNS_OPERATIONAL_ENABLED: {{ .Values.config.externalDNSOperational.enabled | quote }}
  {{- if .Values.config.externalDNSOperational.enabled }}
  KUBERPLOY_EXTERNAL_DNS_PLATFORM_BINDING_ID: {{ .Values.config.externalDNSOperational.platformBindingID | quote }}
  KUBERPLOY_EXTERNAL_DNS_CLUSTER_ID: {{ .Values.config.externalDNSOperational.clusterID | quote }}
  KUBERPLOY_EXTERNAL_DNS_NAMESPACE: {{ .Values.config.externalDNSOperational.namespace | quote }}
  KUBERPLOY_EXTERNAL_DNS_VERSION: {{ .Values.config.externalDNSOperational.version | quote }}
  KUBERPLOY_EXTERNAL_DNS_IMAGE: {{ .Values.config.externalDNSOperational.image | quote }}
  KUBERPLOY_EXTERNAL_DNS_SERVICE_ACCOUNT: {{ .Values.config.externalDNSOperational.serviceAccount | quote }}
  KUBERPLOY_EXTERNAL_DNS_POLL_SECONDS: {{ .Values.config.externalDNSOperational.pollIntervalSeconds | quote }}
  {{- end }}
  KUBERPLOY_ARGO_OBSERVATION_ENABLED: {{ .Values.config.argoObservation.enabled | quote }}
  KUBERPLOY_ARGO_NAMESPACE: {{ ternary .Values.config.argoDesiredState.namespace .Values.config.argoObservation.namespace .Values.config.argoDesiredState.enabled | quote }}
  KUBERPLOY_ARGO_OBSERVATION_POLL_INTERVAL_SECONDS: {{ .Values.config.argoObservation.pollIntervalSeconds | quote }}
  KUBERPLOY_ARGO_DESIRED_STATE_ENABLED: {{ .Values.config.argoDesiredState.enabled | quote }}
  KUBERPLOY_ENVIRONMENT_FOUNDATION_ENABLED: {{ .Values.config.environmentFoundation.enabled | quote }}
  KUBERPLOY_HELM_APPLICATIONS_ENABLED: {{ .Values.config.helmApplications.enabled | quote }}
  {{- if .Values.config.helmApplications.enabled }}
  KUBERPLOY_HELM_RENDERER_NAMESPACE: {{ .Values.config.helmApplications.rendererNamespace | quote }}
  KUBERPLOY_HELM_RENDERER_SERVICE_ACCOUNT: {{ include "kuberploy.helmRendererServiceAccount" . | quote }}
  KUBERPLOY_HELM_RENDERER_POLL_MILLISECONDS: {{ .Values.config.helmApplications.rendererPollMilliseconds | quote }}
  KUBERPLOY_HELM_WORK_POLL_MILLISECONDS: {{ .Values.config.helmApplications.workPollMilliseconds | quote }}
  KUBERPLOY_HELM_RENDER_LEASE_SECONDS: {{ .Values.config.helmApplications.renderLeaseSeconds | quote }}
  KUBERPLOY_HELM_PUBLISH_LEASE_SECONDS: {{ .Values.config.helmApplications.publishLeaseSeconds | quote }}
  KUBERPLOY_HELM_READINESS_LEASE_SECONDS: {{ .Values.config.helmApplications.readinessLeaseSeconds | quote }}
  KUBERPLOY_HELM_OCI_REQUEST_SECONDS: {{ .Values.config.helmApplications.ociRequestSeconds | quote }}
  KUBERPLOY_HELM_OCI_REGISTRY_HOSTS: {{ join "," .Values.config.helmApplications.ociRegistryHosts | quote }}
  {{- if .Values.config.helmApplications.ociAuthHosts }}
  KUBERPLOY_HELM_OCI_AUTH_HOSTS: {{ join "," .Values.config.helmApplications.ociAuthHosts | quote }}
  {{- end }}
  {{- if .Values.config.helmApplications.ociCredentialProfiles }}
  {{- $runtimeCredentialProfiles := list -}}
  {{- range $profile := .Values.config.helmApplications.ociCredentialProfiles -}}
    {{- $projectionIdentity := printf "helm-oci-projection.v1%c%s%c%s%c%s%c%s%c%s%c%s%c%s%c%s" 0 $profile.registryHost 0 $profile.authHost 0 $profile.name 0 $profile.mode 0 $profile.secretRef.name 0 $profile.secretRef.usernameKey 0 $profile.secretRef.passwordKey 0 $profile.secretRef.tokenKey -}}
    {{- $runtimeCredentialProfiles = append $runtimeCredentialProfiles (dict "registryHost" $profile.registryHost "authHost" $profile.authHost "name" $profile.name "mode" $profile.mode "projectionDigest" (printf "sha256:%s" (sha256sum $projectionIdentity))) -}}
  {{- end }}
  KUBERPLOY_HELM_OCI_CREDENTIAL_PROFILES_JSON: {{ toJson $runtimeCredentialProfiles | quote }}
  {{- end }}
  KUBERPLOY_HELM_PACKAGE_CACHE_BYTES: {{ .Values.config.helmApplications.packageCacheBytes | quote }}
  KUBERPLOY_HELM_ARGO_NAMESPACE: {{ .Values.config.argoDesiredState.namespace | quote }}
  {{- end }}
  {{- if .Values.config.environmentFoundation.enabled }}
  KUBERPLOY_ENVIRONMENT_FOUNDATION_PLATFORM_BINDING_ID: {{ .Values.config.environmentFoundation.platformBindingID | quote }}
  KUBERPLOY_ENVIRONMENT_FOUNDATION_PSA_VERSION: {{ .Values.config.environmentFoundation.psaVersion | quote }}
  KUBERPLOY_ENVIRONMENT_FOUNDATION_POLL_INTERVAL_SECONDS: {{ .Values.config.environmentFoundation.pollIntervalSeconds | quote }}
  KUBERPLOY_ENVIRONMENT_FOUNDATION_CONTROL_PLANE_NAMESPACE: {{ .Release.Namespace | quote }}
  KUBERPLOY_ENVIRONMENT_FOUNDATION_OBSERVER_SERVICE_ACCOUNT: {{ include "kuberploy.componentName" (dict "root" . "component" "api") | quote }}
  {{- end }}
  {{- if .Values.config.argoDesiredState.enabled }}
  KUBERPLOY_ARGO_PLATFORM_BINDING_ID: {{ .Values.config.argoDesiredState.platformBindingID | quote }}
  KUBERPLOY_ARGO_RUNTIME_CHART_REPOSITORY: {{ .Values.config.argoDesiredState.runtimeChartRepository | quote }}
  KUBERPLOY_ARGO_RUNTIME_CHART_VERSION: {{ .Values.config.argoDesiredState.runtimeChartVersion | quote }}
  KUBERPLOY_ARGO_RUNTIME_CHART_DIGEST: {{ .Values.config.argoDesiredState.runtimeChartDigest | quote }}
  KUBERPLOY_ARGO_RENDERER_IMAGE: {{ .Values.components.worker.image.reference | quote }}
  KUBERPLOY_ARGO_DESIRED_STATE_POLL_INTERVAL_SECONDS: {{ .Values.config.argoDesiredState.pollIntervalSeconds | quote }}
  KUBERPLOY_ARGO_CATALOG_MAX_AGE_SECONDS: {{ .Values.config.argoDesiredState.catalogMaxAgeSeconds | quote }}
  {{- end }}
  KUBERPLOY_MANAGED_REGISTRY_RUNTIME_ENABLED: {{ .Values.config.managedRegistry.enabled | quote }}
  KUBERPLOY_MANAGED_REGISTRY_TARGET_ID: {{ .Values.config.managedRegistry.targetID | quote }}
  KUBERPLOY_MANAGED_REGISTRY_TARGET_NAME: {{ .Values.config.managedRegistry.targetName | quote }}
  KUBERPLOY_MANAGED_REGISTRY_ENDPOINT: {{ .Values.config.managedRegistry.endpoint | quote }}
  KUBERPLOY_MANAGED_REGISTRY_REPOSITORY_PREFIX: {{ .Values.config.managedRegistry.repositoryPrefix | quote }}
  KUBERPLOY_MANAGED_REGISTRY_PULL_CREDENTIAL_REF: {{ .Values.config.managedRegistry.pullCredentialRef | quote }}
  KUBERPLOY_MANAGED_REGISTRY_PUSH_CREDENTIAL_REF: {{ .Values.config.managedRegistry.pushCredentialRef | quote }}
  KUBERPLOY_MANAGED_REGISTRY_CACHE_CREDENTIAL_REF: {{ .Values.config.managedRegistry.cacheCredentialRef | quote }}
  KUBERPLOY_MANAGED_REGISTRY_LIFECYCLE_CREDENTIAL_REF: {{ .Values.config.managedRegistry.lifecycleCredentialRef | quote }}
  KUBERPLOY_MANAGED_REGISTRY_ALLOW_PLAIN_HTTP: {{ .Values.config.managedRegistry.allowPlainHTTP | quote }}
  KUBERPLOY_MANAGED_REGISTRY_NAMESPACE: {{ .Values.config.managedRegistry.namespace | quote }}
  KUBERPLOY_MANAGED_REGISTRY_DEPLOYMENT: {{ .Values.config.managedRegistry.deployment | quote }}
  KUBERPLOY_MANAGED_REGISTRY_PVC: {{ .Values.config.managedRegistry.persistentVolumeClaim | quote }}
  KUBERPLOY_MANAGED_REGISTRY_CONFIG_MAP: {{ .Values.config.managedRegistry.registryConfigMap | quote }}
  KUBERPLOY_MANAGED_REGISTRY_HELPER_SERVICE_ACCOUNT: {{ include "kuberploy.registryMaintenanceServiceAccount" . | quote }}
  KUBERPLOY_MANAGED_REGISTRY_HELPER_IMAGE: {{ .Values.components.worker.image.reference | quote }}
  KUBERPLOY_MANAGED_REGISTRY_OBSERVATION_SECONDS: {{ .Values.config.managedRegistry.observationIntervalSeconds | quote }}
  KUBERPLOY_BUILDER_NAMESPACE: {{ .Values.builder.namespace.name | quote }}
  KUBERPLOY_BUILDER_POD_SERVICE_ACCOUNT: {{ .Values.builder.podServiceAccount.name | quote }}
  KUBERPLOY_BUILDER_AGENT_IMAGE: {{ .Values.builder.builderAgentImage | quote }}
  KUBERPLOY_BUILDER_BUILDKIT_IMAGE: {{ .Values.builder.buildKitImage | quote }}
  KUBERPLOY_BUILDER_SOURCE_EGRESS_CIDRS: {{ join "," .Values.builder.networkPolicy.sourceEgressCIDRs | quote }}
  KUBERPLOY_BUILDER_REGISTRY_EGRESS_CIDRS: {{ join "," .Values.builder.networkPolicy.registryEgressCIDRs | quote }}
  KUBERPLOY_API_UPSTREAM: {{ printf "http://%s-api:%v" (include "kuberploy.fullname" .) .Values.components.api.port | quote }}
