  {{- if or (ne (int64 .Values.config.edgeRuntime.pollIntervalSeconds) 30) (ne (int64 .Values.config.edgeRuntime.workLeaseSeconds) 120) (ne (int64 .Values.config.edgeRuntime.heartbeatSeconds) 20) (ne (int64 .Values.config.edgeRuntime.readinessSeconds) 90) (ne (int64 .Values.config.edgeRuntime.minimumBackoffSeconds) 5) (ne (int64 .Values.config.edgeRuntime.maximumBackoffSeconds) 300) -}}
  {{- fail "disabled edge runtime rejects dormant timing overrides" -}}
