  {{- end -}}
  {{- if or (not (regexMatch "@sha256:[a-f0-9]{64}$" .Values.components.api.image.reference)) (not (regexMatch "@sha256:[a-f0-9]{64}$" .Values.components.worker.image.reference)) -}}
  {{- fail "edge runtime requires digest-pinned API and worker images" -}}
  {{- end -}}
  {{- $requiredTraefikCRDs := list "ingressroutes.traefik.io" "ingressroutetcps.traefik.io" "ingressrouteudps.traefik.io" "middlewares.traefik.io" "middlewaretcps.traefik.io" "serverstransports.traefik.io" "serverstransporttcps.traefik.io" "tlsoptions.traefik.io" "tlsstores.traefik.io" "traefikservices.traefik.io" -}}
  {{- if $edgeTraefik -}}
    {{- if hasKey $edgeTraefik "sslip" -}}
