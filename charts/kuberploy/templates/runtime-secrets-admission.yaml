{{- if .Values.config.runtimeSecrets.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kuberploy.runtimeSecretAdmissionPolicyName" . }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-secrets-admission
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["bitnami.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "DELETE"]
        resources: ["sealedsecrets"]
        scope: Namespaced
  validations:
    - expression: {{ printf "request.userInfo.username == '%s'" (include "kuberploy.runtimeSecretAPIUsername" .) | quote }}
      message: only the exact Kuberploy API ServiceAccount may create or delete runtime SealedSecrets
    - expression: {{ printf "request.namespace in %s" (toJson .Values.config.runtimeSecrets.namespaces) | quote }}
      message: runtime SealedSecrets are confined to the explicit namespace allowlist
    - expression: >-
        request.operation != 'CREATE' ||
        (object.apiVersion == 'bitnami.com/v1alpha1' && object.kind == 'SealedSecret' &&
        object.metadata.namespace == request.namespace &&
        object.metadata.name.matches('^kp-[a-z0-9]([-a-z0-9]*[a-z0-9])?-v[1-9][0-9]{0,18}-[0-9a-f]{10}$') &&
        object.metadata.labels.size() == 7 &&
        object.metadata.labels['app.kubernetes.io/name'] == 'kuberploy-runtime-secret' &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'kuberploy' &&
        object.metadata.labels['app.kubernetes.io/component'] == 'sealed-secret' &&
        object.metadata.labels['kuberploy.io/secret-binding'].matches('^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$') &&
        object.metadata.labels['kuberploy.io/secret-version'].matches('^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$') &&
        object.metadata.labels['kuberploy.io/secret-provider'] == 'sealed-secrets' &&
        object.metadata.labels['kuberploy.io/target-secret'] == object.metadata.name &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0))
      message: created SealedSecrets require the exact immutable Kuberploy identity envelope
    - expression: >-
        request.operation != 'CREATE' ||
        (object.metadata.annotations.size() == 3 &&
        object.metadata.annotations['kuberploy.io/content-fingerprint'].matches('^sha256:[0-9a-f]{64}$') &&
        object.metadata.annotations['kuberploy.io/sealing-key-fingerprint'].matches('^sha256:[0-9a-f]{64}$') &&
        object.metadata.annotations['kuberploy.io/secret-manifest-digest'].matches('^sha256:[0-9a-f]{64}$'))
      message: created SealedSecrets require exact safe integrity identities
    - expression: >-
        request.operation != 'CREATE' ||
        (object.spec.size() == 2 &&
        ((object.spec.template.type == 'Opaque' && object.spec.encryptedData.size() >= 1 && object.spec.encryptedData.size() <= 64) ||
        (object.spec.template.type == 'kubernetes.io/tls' && object.spec.encryptedData.size() == 2 &&
        'tls.crt' in object.spec.encryptedData && 'tls.key' in object.spec.encryptedData)) &&
        object.spec.template.size() == 3 && object.spec.template.immutable == true &&
        object.spec.template.metadata.size() == 3 && object.spec.template.metadata.name == object.metadata.name &&
        object.spec.template.metadata.namespace == object.metadata.namespace &&
        object.spec.template.metadata.labels == object.metadata.labels)
      message: created SealedSecrets require an immutable same-name Opaque template or an exact two-key kubernetes.io/tls certificate template
    - expression: >-
        request.operation != 'DELETE' ||
        (oldObject.apiVersion == 'bitnami.com/v1alpha1' && oldObject.kind == 'SealedSecret' &&
        oldObject.metadata.namespace == request.namespace && oldObject.metadata.name == request.name &&
        oldObject.metadata.name.matches('^kp-[a-z0-9]([-a-z0-9]*[a-z0-9])?-v[1-9][0-9]{0,18}-[0-9a-f]{10}$') &&
        oldObject.metadata.labels.size() == 7 &&
        oldObject.metadata.labels['app.kubernetes.io/name'] == 'kuberploy-runtime-secret' &&
        oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'kuberploy' &&
        oldObject.metadata.labels['app.kubernetes.io/component'] == 'sealed-secret' &&
        oldObject.metadata.labels['kuberploy.io/secret-binding'].matches('^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$') &&
        oldObject.metadata.labels['kuberploy.io/secret-version'].matches('^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$') &&
        oldObject.metadata.labels['kuberploy.io/secret-provider'] == 'sealed-secrets' &&
        oldObject.metadata.labels['kuberploy.io/target-secret'] == oldObject.metadata.name &&
        oldObject.metadata.annotations.size() == 3 &&
        oldObject.metadata.annotations['kuberploy.io/content-fingerprint'].matches('^sha256:[0-9a-f]{64}$') &&
        oldObject.metadata.annotations['kuberploy.io/sealing-key-fingerprint'].matches('^sha256:[0-9a-f]{64}$') &&
        oldObject.metadata.annotations['kuberploy.io/secret-manifest-digest'].matches('^sha256:[0-9a-f]{64}$') &&
        oldObject.spec.size() == 2 &&
        ((oldObject.spec.template.type == 'Opaque' && oldObject.spec.encryptedData.size() >= 1 && oldObject.spec.encryptedData.size() <= 64) ||
        (oldObject.spec.template.type == 'kubernetes.io/tls' && oldObject.spec.encryptedData.size() == 2 &&
        'tls.crt' in oldObject.spec.encryptedData && 'tls.key' in oldObject.spec.encryptedData)) &&
        oldObject.spec.template.immutable == true &&
        oldObject.spec.template.metadata.name == oldObject.metadata.name &&
        oldObject.spec.template.metadata.namespace == oldObject.metadata.namespace &&
        oldObject.spec.template.metadata.labels == oldObject.metadata.labels)
      message: deletion is limited to an exact Kuberploy-managed immutable SealedSecret
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "kuberploy.runtimeSecretAdmissionPolicyName" . }}
  labels:
    {{- include "kuberploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-secrets-admission
spec:
  policyName: {{ include "kuberploy.runtimeSecretAdmissionPolicyName" . }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- toYaml .Values.config.runtimeSecrets.namespaces | nindent 12 }}
{{- end }}
